<style>
body {
  background: transparent; color: #fff;
  font-family: 'Courier New', Courier, monospace;
  margin: 0; padding: 10px;
  overflow: hidden; box-sizing: border-box;
}
.main-wrapper {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: #020205; border-radius: 8px;
  height: 660px; position: relative;
  overflow: hidden; box-sizing: border-box;
}

/* 🧭 NAVIGATION UTAMA */
.top-nav {
  position: absolute; top: 15px; left: 15px; right: 15px;
  display: flex; justify-content: space-between; align-items: center; z-index: 100;
}
.nav-left { display: flex; gap: 8px; }
.nav-btn {
  background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.4);
  padding: 8px 14px; font-size: 11px; cursor: pointer; border-radius: 4px;
  font-family: inherit; text-transform: uppercase; transition: all 0.2s;
}
.nav-btn:hover { background: #fff; color: #000; }

/* 📊 DASHBOARD STATUS BAR */
.status-panel {
  position: absolute; top: 15px; right: 15px;
  background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 10px; border-radius: 6px; width: 140px; font-size: 10px;
}
.bar-row { margin-bottom: 6px; }
.bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
.bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

/* 🐉 HUB TENGAH: TOM INTERACTION SYSTEM */
.pet-center-stage {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10; pointer-events: none;
}
.pet-draggable-area {
  width: 180px; height: 180px; display: flex; align-items: center; justify-content: center;
  cursor: grab; pointer-events: auto; position: relative;
  transition: transform 0.1s ease;
}
.pet-draggable-area:active { cursor: grabbing; }
.pet-main-graphic {
  width: 100%; height: 100%; object-fit: contain;
  animation: petIdleFloat 3.5s infinite ease-in-out;
  user-select: none; -webkit-user-drag: none;
}
@keyframes petIdleFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-8px) scale(1.02); }
}
.pet-title-tag {
  font-size: 13px; font-weight: bold; margin-top: 10px; letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255,255,255,0.4);
}

/* 🎒 BAG & FEEDING CONTROLLER */
.bottom-controls {
  position: absolute; bottom: 15px; left: 15px; right: 15px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 100;
}
.inventory-belt {
  display: flex; gap: 8px; background: rgba(0,0,0,0.7);
  padding: 8px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
}
.food-slot {
  width: 38px; height: 38px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  cursor: pointer; position: relative; transition: transform 0.2s;
}
.food-slot:hover { transform: scale(1.1); border-color: #fff; }
.food-slot.elixir-slot { border-color: #00ffff; background: rgba(0,255,255,0.05); }
.food-count {
  position: absolute; bottom: -2px; right: -2px; background: #fff; color: #000;
  font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 6px;
}

/* ⚔️ SCREEN OVERLAYS */
.screen-overlay {
  position: absolute; inset: 0; background: #020206; z-index: 500;
  display: none; flex-direction: column; padding: 15px; box-sizing: border-box;
}
.battle-arena-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 40px 0 15px 0;
}
.fighter-card {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
  padding: 12px; border-radius: 6px; text-align: center;
}
.fighter-img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 8px; }
.rarity-tag { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }

.combat-log-screen {
  background: #000; border: 1px solid rgba(255,255,255,0.1); height: 110px;
  overflow-y: auto; padding: 8px; font-size: 10px; color: #00ff00; border-radius: 4px;
}

/* 📖 BESTIARY & PARTY MANAGEMENT GRID */
.grid-bestiary, .grid-party {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  margin-top: 45px; max-height: 540px; overflow-y: auto; padding-right: 5px;
}
.beast-card-slot {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px; padding: 8px; text-align: center; font-size: 9px; opacity: 0.4;
  position: relative;
}
.beast-card-slot.discovered { opacity: 1; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.05); }
.beast-card-slot img { width: 45px; height: 45px; object-fit: contain; filter: brightness(0); }
.beast-card-slot.discovered img { filter: brightness(1); }

.select-party-btn {
  margin-top: 5px; background: #fff; color: #000; border: none; font-size: 8px;
  padding: 3px 6px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 3px;
  width: 100%; display: none;
}
.beast-card-slot.discovered .select-party-btn { display: block; }
</style>

<script>
// Web Audio API Sound Generator (Biar gak ketergantungan file mp3 luar, kita buat generator otomatis)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playGrowlSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  
  osc.type = 'sawtooth';
  // Menggeram frekuensi rendah bergoyang
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(45, audioCtx.currentTime + 0.4);
  
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(300, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

function playPurrSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.setValueAtTime(120, audioCtx.currentTime + 0.15);
  
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}
</script>

<script>
// Database & Setup Global Parameter
let corePet = { name: "Naga1", level: 1, hp: 100, maxHp: 100, hunger: 100, maxHunger: 100, exp: 0, maxExp: 100 };
let foodBag = { apple: 3, candy: 2, juice: 2, bread: 1, burger: 0, pizza: 0, elixir: 1 };
let discoveredBeasts = ["Naga1"]; 

const foodValues = {
  apple:  { xp: 10, hp: 15, hunger: 20 },
  candy:  { xp: 15, hp: 10, hunger: 15 },
  juice:  { xp: 20, hp: 20, hunger: 25 },
  bread:  { xp: 25, hp: 30, hunger: 35 },
  burger: { xp: 40, hp: 45, hunger: 50 },
  pizza:  { xp: 60, hp: 60, hunger: 65 }
};

const potentialEnemies = [
  { name: "Void Slime", rarity: "Common", multiplier: 1, img: "Serigala1.png" },
  { name: "Shadow Basilisk", rarity: "Rare", multiplier: 1.4, img: "Ikan1.png" },
  { name: "Phantom Griffin", rarity: "Epic", multiplier: 2, img: "Serigala2.png" },
  { name: "Inferno Drake", rarity: "Mythic", multiplier: 3.5, img: "Naga2.png" },
  { name: "Amaterasu Core", rarity: "Celestial", multiplier: 5, img: "Naga3.png" }
];

const allBeastList = [
  "Naga1", "Naga2", "Naga3", "Naga4", "Naga5",
  "Ikan1", "Ikan2", "Ikan3", "Ikan4", "Ikan5",
  "Serigala1", "Serigala2", "Serigala3", "Serigala4", "Serigala5"
];

let activeEnemy = null;
let dragActive = false;
let startX, currentTransformX = 0;
const petActor = document.getElementById("petActor");

// LOAD & SAVE ENGINE LOCALSTORAGE
function saveLocalData() {
  localStorage.setItem("BLDS_BEAST_BAG", JSON.stringify(foodBag));
  localStorage.setItem("BLDS_BEAST_DISCOVERED", JSON.stringify(discoveredBeasts));
  localStorage.setItem("BLDS_BEAST_ALIVE_STATUS", JSON.stringify(corePet));
}

function loadLocalData() {
  const b = localStorage.getItem("BLDS_BEAST_BAG"); if(b) foodBag = JSON.parse(b);
  const d = localStorage.getItem("BLDS_BEAST_DISCOVERED"); if(d) discoveredBeasts = JSON.parse(d);
  const s = localStorage.getItem("BLDS_BEAST_ALIVE_STATUS");
  if(s) {
    const loaded = JSON.parse(s);
    corePet = loaded;
  }
  syncInterfaceGraphic();
}

function syncInterfaceGraphic() {
  document.getElementById("petGraphicFile").src = corePet.name + ".png";
  document.getElementById("petLabelTag").innerText = `${corePet.name}.png [Lvl ${corePet.level}]`;
  renderStats();
  updateInventoryCounters();
}

function renderStats() {
  document.getElementById("txtHp").innerText = `${corePet.hp}/${corePet.maxHp}`;
  document.getElementById("fillHp").style.width = `${(corePet.hp / corePet.maxHp) * 100}%`;
  
  document.getElementById("txtHunger").innerText = `${corePet.hunger}/${corePet.maxHunger}`;
  document.getElementById("fillHunger").style.width = `${(corePet.hunger / corePet.maxHunger) * 100}%`;
  
  const expPct = (corePet.exp / corePet.maxExp) * 100;
  document.getElementById("txtExp").innerText = `${Math.floor(expPct)}%`;
  document.getElementById("fillExp").style.width = `${expPct}%`;
}

function updateInventoryCounters() {
  Object.keys(foodBag).forEach(key => {
    const el = document.getElementById(`count-${key}`);
    if(el) el.innerText = foodBag[key];
  });
}

// 🧬 SWITCH PET ENGINE
function switchActivePet(targetPetName) {
  corePet.name = targetPetName;
  playGrowlSound();
  saveLocalData();
  syncInterfaceGraphic();
  closeScreen('bestiaryScreen');
}

// 🍏 FEED SYSTEM & RECOVERY
function feedPet(itemKey) {
  if (foodBag[itemKey] <= 0) { alert("Food item empty! Hunt down some wild beast."); return; }
  if (corePet.hunger >= corePet.maxHunger && corePet.hp >= corePet.maxHp) { alert("Your pet status is fully loaded."); return; }
  
  foodBag[itemKey]--;
  const effect = foodValues[itemKey];
  
  corePet.hp = Math.min(corePet.maxHp, corePet.hp + effect.hp);
  corePet.hunger = Math.min(corePet.maxHunger, corePet.hunger + effect.hunger);
  
  addExp(effect.xp);
  playPurrSound();
  saveLocalData();
  renderStats();
  updateInventoryCounters();
}

// 🧪 LAB INJECTION ELIXIR FULL RECOVERY
function useFullElixir() {
  if (foodBag.elixir <= 0) { alert("You don't have any Elixir! Drop rate is 10% from combat."); return; }
  if (corePet.hp >= corePet.maxHp) { alert("Health matrix is already at peak performance!"); return; }
  
  foodBag.elixir--;
  corePet.hp = corePet.maxHp; // Instan Full HP
  
  playPurrSound();
  saveLocalData();
  renderStats();
  updateInventoryCounters();
  alert("🧪 Elixir Synced! Health fully restored to 100%.");
}

function addExp(amount) {
  corePet.exp += amount;
  if (corePet.exp >= corePet.maxExp) {
    corePet.exp -= corePet.maxExp;
    corePet.level++;
    corePet.maxHp = 100 + (corePet.level * 10);
    corePet.maxExp = 100 + (corePet.level * 25);
    alert(`🎉 Level Up! Deployed Core reached Level ${corePet.level}!`);
  }
}

// 🕹️ DRAG SYSTEM (SMOOTH TOM BEHAVIOR + SOUND TRACKING)
petActor.addEventListener("mousedown", (e) => { dragActive = true; startX = e.clientX; });
window.addEventListener("mousemove", (e) => {
  if (!dragActive) return;
  currentTransformX = e.clientX - startX;
  petActor.style.transform = `translateX(${currentTransformX}px)`;
  if(Math.abs(currentTransformX) > 80 && Math.random() < 0.05) { playGrowlSound(); }
});
window.addEventListener("mouseup", () => {
  if (!dragActive) return;
  dragActive = false;
  petActor.style.transition = "transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
  petActor.style.transform = "translateX(0px)";
  setTimeout(() => { petActor.style.transition = "transform 0.1s ease"; }, 500);
});

// ⚔️ AUTOMATIC COMBAT LOGIC FOR FOOD AND EXP HUNTING
function prepareBattle() {
  activeEnemy = Object.assign({}, potentialEnemies[Math.floor(Math.random() * potentialEnemies.length)]);
  const lvlMod = Math.floor(corePet.level * (0.8 + Math.random() * 0.5)) || 1;
  
  activeEnemy.maxHp = Math.floor((40 + (lvlMod * 8)) * activeEnemy.multiplier);
  activeEnemy.hp = activeEnemy.maxHp;
  activeEnemy.dmg = Math.floor((8 + (lvlMod * 2)) * activeEnemy.multiplier);
  
  document.getElementById("btPlayerImg").src = corePet.name + ".png";
  document.getElementById("btPlayerName").innerText = corePet.name;
  document.getElementById("btPlayerHp").innerText = `${corePet.hp}/${corePet.maxHp} HP`;
  
  document.getElementById("btEnemyImg").src = activeEnemy.img;
  document.getElementById("btEnemyName").innerText = `${activeEnemy.name} [Lvl ${lvlMod}]`;
  document.getElementById("btEnemyHp").innerText = `${activeEnemy.hp}/${activeEnemy.maxHp} HP`;
  
  const tag = document.getElementById("btEnemyRarity");
  tag.innerText = activeEnemy.rarity;
  if(activeEnemy.rarity === "Celestial") tag.style.background = "#ffff00", tag.style.color="#000";
  else if(activeEnemy.rarity === "Mythic") tag.style.background = "#ff3333", tag.style.color="#fff";
  else tag.style.background = "#ffffff", tag.style.color="#000";
  
  document.getElementById("battleLogBox").innerHTML = `<div style='color:#ffff00;'>Confrontation matrix initialized against a wild ${activeEnemy.rarity} encounter.</div>`;
  document.getElementById("btActionBtn").disabled = false;
}

function startCombatEngine() {
  document.getElementById("btActionBtn").disabled = true;
  const log = document.getElementById("battleLogBox");
  let pCurrentHp = corePet.hp;
  
  let turn = 0;
  let interval = setInterval(() => {
    turn++;
    // Player Attack Phase
    let pDmg = Math.floor((15 + (corePet.level * 3)) * (0.8 + Math.random() * 0.4));
    activeEnemy.hp = Math.max(0, activeEnemy.hp - pDmg);
    log.innerHTML += `<div>⚔️ Turn ${turn}: Your ${corePet.name} hits for <b>${pDmg}</b> damage.</div>`;
    document.getElementById("btEnemyHp").innerText = `${activeEnemy.hp}/${activeEnemy.maxHp} HP`;
    log.scrollTop = log.scrollHeight;
    
    if (activeEnemy.hp <= 0) {
      clearInterval(interval);
      
      // Hitung EXP Persentase Berdasarkan Rarity
      let pctReward = 0.15; 
      let lootItems = ["apple", "candy"];
      
      if (activeEnemy.rarity === "Celestial") { pctReward = 0.60; lootItems = ["burger", "pizza", "juice"]; }
      else if (activeEnemy.rarity === "Mythic") { pctReward = 0.45; lootItems = ["burger", "bread", "pizza"]; }
      else if (activeEnemy.rarity === "Epic") { pctReward = 0.35; lootItems = ["bread", "juice"]; }
      else if (activeEnemy.rarity === "Rare") { pctReward = 0.25; lootItems = ["juice", "candy"]; }
      
      let expGained = Math.floor(corePet.maxExp * pctReward);
      addExp(expGained);
      
      // Berikan Loot Makanan Acak
      let rewardItem = lootItems[Math.floor(Math.random() * lootItems.length)];
      foodBag[rewardItem] += Math.floor(1 + Math.random() * 2);
      
      // 🧪 CHANCE DROP ELIXIR FULL RECOVERY (STRICT 10%)
      let elixirDropped = false;
      if (Math.random() <= 0.10) {
        foodBag.elixir++;
        elixirDropped = true;
      }
      
      log.innerHTML += `<div style='color:#00ff00; font-weight:bold;'>🏆 Victory! Earned ${expGained} EXP (${Math.floor(pctReward * 100)}%).</div>`;
      if (elixirDropped) {
        log.innerHTML += `<div style='color:#00ffff; font-weight:bold;'>🧪 BONUS DROP: Obtained 1x Ultra Full Elixir (10% Chance Luck)!</div>`;
      }
      
      if (!discoveredBeasts.includes(activeEnemy.name)) discoveredBeasts.push(activeEnemy.name);
      
      corePet.hp = pCurrentHp; 
      saveLocalData(); syncInterfaceGraphic();
      return;
    }
    
    // Enemy Attack Phase
    let eDmg = Math.floor(activeEnemy.dmg * (0.8 + Math.random() * 0.4));
    pCurrentHp = Math.max(0, pCurrentHp - eDmg);
    log.innerHTML += `<div style='color:#ff4a4a;'>💥 Turn ${turn}: Enemy retaliates dealing <b>${eDmg}</b> damage.</div>`;
    document.getElementById("btPlayerHp").innerText = `${pCurrentHp}/${corePet.maxHp} HP`;
    log.scrollTop = log.scrollHeight;
    
    if (pCurrentHp <= 0) {
      clearInterval(interval);
      log.innerHTML += `<div style='color:#ff4a4a; font-weight:bold;'>❌ Defeated. Your pet fainted from the arena.</div>`;
      corePet.hp = 5; // Sisakan 5 HP agar tidak mati total
      saveLocalData(); syncInterfaceGraphic();
    }
  }, 600);
}

// 📖 BESTIARY BUILDER SCREEN (DENGAN TOMBOL SWITCH GANTI HEWAN)
function buildBestiaryUI() {
  const container = document.getElementById("bestiaryGridContainer");
  container.innerHTML = allBeastList.map(beastName => {
    const isFound = discoveredBeasts.includes(beastName);
    const isCurrentlyActive = (corePet.name === beastName);
    
    return `
      <div class="beast-card-slot ${isFound ? 'discovered' : ''}">
        <img src="${beastName}.png" alt="Beast" onerror="this.style.opacity='0.2';">
        <div style="margin-top:5px; font-weight:bold; overflow:hidden; text-overflow:ellipsis;">${isFound ? beastName : 'Unknown'}</div>
        ${isFound ? 
          (isCurrentlyActive ? 
            `<button class="select-party-btn" style="background:#00ff00; color:#000;" disabled>Deployed</button>` : 
            `<button class="select-party-btn" onclick="switchActivePet('${beastName}')">Deploy</button>`
          ) : ''
        }
      </div>
    `;
  }).join('');
}

// NAVIGATION CONTROLLER
function openScreen(id) {
  document.getElementById(id).style.display = "flex";
  if(id === "bestiaryScreen") buildBestiaryUI();
}
function closeScreen(id) { document.getElementById(id).style.display = "none"; }

window.addEventListener("load", () => { loadLocalData(); });
</script>
