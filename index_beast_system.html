<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLDS | Beast Engine Game Core</title>
    <style>
        /* ===================================================
           TEMA HITAM ASLI BAWAAN ENGINE GAME KAMU
           =================================================== */
        body {
            background-color: #020205;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            box-sizing: border-box;
            user-select: none;
        }

        .main-wrapper {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #020205;
            border-radius: 8px;
            height: 660px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 🧭 NAVIGASI HUD ATAS */
        .top-nav-container {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            gap: 10px;
            pointer-events: none;
        }

        .nav-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-btn:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .status-panel {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 10px;
            border-radius: 6px;
            width: 145px;
            font-size: 10px;
            pointer-events: auto;
        }

        .bar-row { margin-bottom: 5px; }
        .bar-row:last-child { margin-bottom: 0; }
        .bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

        /* 🐉 PHYSICS ACTOR */
        .pet-center-stage { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        .pet-draggable-area {
            width: 150px; height: 150px; display: flex; align-items: center; justify-content: center;
            cursor: grab; pointer-events: auto; position: absolute; left: calc(50% - 75px); top: calc(50% - 75px); touch-action: none;
        }
        .pet-draggable-area:active { cursor: grabbing; }
        .pet-main-graphic { width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
        .pet-floating-anim { animation: petIdleFloat 3.5s infinite ease-in-out; }
        @keyframes petIdleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .static-title-hud { position: absolute; top: 220px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; pointer-events: none; }
        .pet-title-tag { font-size: 13px; font-weight: bold; letter-spacing: 1px; line-height: 1.4; text-shadow: 0 0 10px rgba(0,0,0,0.9); text-align: center; }
        .hunt-trigger-wrapper { position: absolute; bottom: 85px; left: 0; right: 0; display: flex; justify-content: center; z-index: 90; }

        /* 🎒 INVENTORY */
        .bottom-controls { position: absolute; bottom: 15px; left: 15px; right: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 100; }
        .inventory-belt { display: flex; gap: 6px; background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); }
        .food-slot { width: 36px; height: 36px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; position: relative; transition: transform 0.2s; }
        .food-slot:hover { transform: scale(1.1); border-color: #fff; }
        .food-count { position: absolute; bottom: -2px; right: -2px; background: #fff; color: #000; font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 6px; }

        /* ⚔️ OVERLAY SYSTEMS (LEADERBOARD & ARENA BATTLE) */
        .screen-overlay { position: absolute; inset: 0; background: #020206; z-index: 500; display: none; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .battle-arena-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 40px 0 10px 0; }
        .fighter-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; text-align: center; position: relative; }
        .fighter-img { width: 65px; height: 65px; object-fit: contain; margin-bottom: 6px; }
        .combat-log-screen { background: #000; border: 1px solid rgba(255,255,255,0.1); height: 110px; overflow-y: auto; padding: 8px; font-size: 10px; color: #00ff00; border-radius: 4px; margin-bottom: 10px; }
        .rpg-action-board { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto; }
        .skill-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px; font-family: inherit; font-size: 10px; cursor: pointer; border-radius: 4px; }
        .skill-btn:hover:not(:disabled) { background: #fff; color: #000; }
        .skill-btn:disabled { opacity: 0.3; }

        /* 📊 TAB LIVE LEADERBOARD */
        .leaderboard-header-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
        .tab-btn { background: rgba(255, 255, 255, 0.05); color: #888888; border: 1px solid rgba(255, 255, 255, 0.15); font-size: 9px; padding: 6px 2px; cursor: pointer; text-align: center; font-family: inherit; border-radius: 4px; text-transform: uppercase; }
        .tab-btn.active-tab { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: bold; }
        .leaderboard-scroll-area { flex-grow: 1; overflow-y: auto; background: #000000; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 6px; box-sizing: border-box; }
        .rank-row { display: grid; grid-template-columns: 30px 1fr 65px; padding: 6px 8px; font-size: 11px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); align-items: center; }
        .rank-num { font-weight: bold; opacity: 0.8; }
        .rank-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-val { text-align: right; font-weight: bold; color: #00ffff; }
        
        .cooldown-blocker { position: absolute; inset: 0; background: rgba(2,2,6,0.95); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div class="cooldown-blocker" id="deathOverlay">
    <div style="font-size: 32px; margin-bottom: 10px;">💀</div>
    <div style="font-size: 14px; font-weight: bold; color: #ff4a4a;">BEAST CRITICAL OVERLOAD</div>
    <div id="countdownTimer" style="font-size: 18px; font-weight: bold; color: #ffff00; margin: 10px 0;">05:00:00</div>
    <button class="nav-btn" style="border-color: #00ffff; color: #00ffff;" onclick="useReviveInstant()">💉 Use Revive Kit (<span id="death-revive-stock">0</span>)</button>
</div>

<div class="main-wrapper" id="windowBox">
  
    <div class="top-nav-container">
        <div class="nav-left">
            <button class="nav-btn" style="border-color:#00ffff; color:#00ffff;" onclick="openLeaderboardScreen()">📊 Leaderboard</button>
        </div>
        
        <div class="status-panel">
            <div class="bar-row">
                <div class="bar-label"><span>HP</span><span id="txtHp">100/100</span></div>
                <div class="bar-bg"><div class="bar-fill" id="fillHp" style="background:#ff4a4a;"></div></div>
            </div>
            <div class="bar-row">
                <div class="bar-label"><span>Hunger</span><span id="txtHunger">100/100</span></div>
                <div class="bar-bg"><div class="bar-fill" id="fillHunger" style="background:#ffa500;"></div></div>
            </div>
            <div class="bar-row">
                <div class="bar-label"><span>EXP</span><span id="txtExp">0%</span></div>
                <div class="bar-bg"><div class="bar-fill" id="fillExp" style="background:#00ff00; width:0%;"></div></div>
            </div>
        </div>
    </div>

    <div class="static-title-hud">
        <div class="pet-title-tag" id="petLabelTag">Aurelius Sovereign [Lvl 10]<br><span style="font-size:9px;color:#888;">Streak: 1</span></div>
    </div>
  
    <div class="hunt-trigger-wrapper">
        <button class="nav-btn" style="border-color:#ff4a4a; color:#ff4a4a;" onclick="openScreen('battleScreen'); prepareBattle();">⚔️ Hunt Wild</button>
    </div>

    <div class="pet-center-stage">
        <div class="pet-draggable-area pet-floating-anim" id="petActor">
            <img class="pet-main-graphic" src="Ikan5.png" alt="Beast Core">
        </div>
    </div>

    <div class="bottom-controls">
        <div class="inventory-belt">
            <div class="food-slot" onclick="feedPet(15, 20)">🍎<span class="food-count">5</span></div>
            <div class="food-slot" onclick="feedPet(10, 15)">🍬<span class="food-count" id="count-pill">3</span></div>
            <div class="food-slot" onclick="healFullElixir()">🧪<span class="food-count">1</span></div>
        </div>
    </div>

    <div class="screen-overlay" id="battleScreen">
        <div class="top-nav-container" style="position:static; margin-bottom:5px;">
            <button class="nav-btn" id="btnExitBattle" onclick="closeScreen('battleScreen')">⬅️ Run</button>
            <div style="font-size:11px; font-weight:bold; color:#ff4a4a; margin-top:5px;">COMBAT PROTOCOL</div>
        </div>
        
        <div class="battle-arena-grid">
            <div class="fighter-card">
                <img class="fighter-img" src="Ikan5.png" alt="Player">
                <div style="font-size:11px; font-weight:bold;">Aurelius</div>
                <div id="btPlayerHp" style="font-size:10px; opacity:0.6;">100/100 HP</div>
            </div>
            <div class="fighter-card">
                <img class="fighter-img" src="Serigala1.png" alt="Enemy">
                <div style="font-size:11px; font-weight:bold;">Wild Lupin</div>
                <div id="btEnemyHp" style="font-size:10px; opacity:0.6;">50/50 HP</div>
            </div>
        </div>
        
        <div class="combat-log-screen" id="battleLogBox"></div>
        
        <div class="rpg-action-board">
            <button class="skill-btn" onclick="executeAttack(1.0, 'Strike')">💥 Strike</button>
            <button class="skill-btn" onclick="executeAttack(1.8, 'Heavy Smash')">🔨 Heavy Smash</button>
        </div>
    </div>

    <div class="screen-overlay" id="leaderboardScreen">
        <div class="top-nav-container" style="position:static; margin-bottom:12px;">
            <button class="nav-btn" style="border-color:#ffffff; color:#ffffff; font-weight:bold;" onclick="closeLeaderboardAndGoHome()">⬅️ BACK</button>
            <div style="font-size:11px; font-weight:bold; color:#00ffff; margin-top:5px;">🌐 Global Live Board</div>
        </div>

        <div class="leaderboard-header-tabs">
            <button class="tab-btn active-tab" id="tabS" onclick="switchTab('streak')">🔥 STREAK</button>
            <button class="tab-btn" id="tabH" onclick="switchTab('hunt')">⚔️ HUNTED</button>
            <button class="tab-btn" id="tabL" onclick="switchTab('lvl')">🌟 PET LVL</button>
        </div>

        <div class="leaderboard-scroll-area" id="leaderboardContainer">
            </div>
    </div>
</div>

<script>
    // System Data State Game
    let state = {
        hp: 100, maxHp: 100,
        hunger: 100, maxHunger: 100,
        exp: 0, maxExp: 100,
        level: 10, power: 35,
        streak: 1, highestStreak: 1, totalHunts: 1,
        deathTime: null,
        reviveStock: 1, pillStock: 3
    };

    let enemyHp = 50; let enemyMaxHp = 50;

    // Sinkronisasi data kode rahasia dari terminal induk web
    window.addEventListener("message", (e) => {
        if(e.data && e.data.type === 'SYNC_BONUS_CODES') {
            const awards = localStorage.getItem("BLDS_BONUS_AWARDS");
            if(awards) {
                const bonus = JSON.parse(awards);
                if(bonus.unlockedRevives > 0) { state.reviveStock += bonus.unlockedRevives; bonus.unlockedRevives = 0; }
                if(bonus.unlockedPills > 0) { state.pillStock += bonus.unlockedPills; bonus.unlockedPills = 0; }
                if(bonus.bonusPower > 0) { state.power += bonus.bonusPower; bonus.bonusPower = 0; }
                localStorage.setItem("BLDS_BONUS_AWARDS", JSON.stringify(bonus));
                saveData(); renderHud();
            }
        }
    });

    function saveData() {
        localStorage.setItem("BLDS_GAME_STATE_DATA", JSON.stringify(state));
    }

    function loadData() {
        const local = localStorage.getItem("BLDS_GAME_STATE_DATA");
        if(local) state = JSON.parse(local);
        renderHud();
        initPhysics();
        setInterval(checkDeath, 1000);
    }

    function renderHud() {
        document.getElementById("txtHp").innerText = `${state.hp}/${state.maxHp}`;
        document.getElementById("fillHp").style.width = `${(state.hp/state.maxHp)*100}%`;
        document.getElementById("txtHunger").innerText = `${state.hunger}/${state.maxHunger}`;
        document.getElementById("fillHunger").style.width = `${(state.hunger/state.maxHunger)*100}%`;
        document.getElementById("txtExp").innerText = `${state.exp}%`;
        document.getElementById("fillExp").style.width = `${state.exp}%`;
        document.getElementById("petLabelTag").innerHTML = `Aurelius Sovereign [Lvl ${state.level}]<br><span style="font-size:9px;color:#00ffff;">Streak: ${state.streak} | High: ${state.highestStreak}</span>`;
        document.getElementById("count-pill").innerText = state.pillStock;
        document.getElementById("death-revive-stock").innerText = state.reviveStock;
    }

    function feedPet(hpPlus, hungerPlus) {
        if(state.hp <= 0) return;
        state.hp = Math.min(state.maxHp, state.hp + hpPlus);
        state.hunger = Math.min(state.maxHunger, state.hunger + hungerPlus);
        state.exp = Math.min(100, state.exp + 10);
        if(state.exp >= 100) { state.exp = 0; state.level++; state.power += 5; state.maxHp += 10; state.hp = state.maxHp; }
        saveData(); renderHud();
    }

    function healFullElixir() {
        state.hp = state.maxHp; state.hunger = state.maxHunger; saveData(); renderHud();
    }

    /* ⚔️ FIGHT LOGIC */
    function prepareBattle() {
        enemyMaxHp = 40 + (state.level * 2); enemyHp = enemyMaxHp;
        document.getElementById("btPlayerHp").innerText = `${state.hp}/${state.maxHp} HP`;
        document.getElementById("btEnemyHp").innerText = `${enemyHp}/${enemyMaxHp} HP`;
        document.getElementById("battleLogBox").innerHTML = "<div>Combat Matrix Online. Choose action profile!</div>";
        document.getElementById("btnExitBattle").innerText = "⬅️ Run";
    }

    function executeAttack(mult, skillName) {
        if(enemyHp <= 0 || state.hp <= 0) return;
        let dmg = Math.floor(state.power * mult);
        enemyHp = Math.max(0, enemyHp - dmg);
        const log = document.getElementById("battleLogBox");
        log.innerHTML += `<div>💥 Your Beast uses <b>${skillName}</b>! Deals <b style='color:#ffff00;'>${dmg}</b> damage.</div>`;
        document.getElementById("btEnemyHp").innerText = `${enemyHp}/${enemyMaxHp} HP`;

        if(enemyHp <= 0) {
            log.innerHTML += "<div style='color:#00ff00;font-weight:bold;'>🏆 HUNT SUCCESSFUL! +25% EXP</div>";
            state.streak++; state.totalHunts++;
            if(state.streak > state.highestStreak) state.highestStreak = state.streak;
            state.exp = Math.min(100, state.exp + 25);
            if(state.exp >= 100) { state.exp = 0; state.level++; state.power += 5; }
            document.getElementById("btnExitBattle").innerText = "⬅️ Exit Arena";
            saveData(); renderHud(); return;
        }

        // Enemy Counter
        setTimeout(() => {
            let eDmg = 8 + Math.floor(state.level * 0.5);
            state.hp = Math.max(0, state.hp - eDmg);
            log.innerHTML += `<div style='color:#ff4a4a;'>⚠️ Wild beast strikes back! Sustained <b>${eDmg}</b> damage.</div>`;
            document.getElementById("btPlayerHp").innerText = `${state.hp}/${state.maxHp} HP`;
            renderHud();

            if(state.hp <= 0) {
                log.innerHTML += "<div style='color:#ff0000;'>💀 SYSTEM FAILURE: BEAST COLLAPSED!</div>";
                state.streak = 0;
                state.deathTime = Date.now() + (5 * 60 * 60 * 1000); // 5 Jam Cooldown
                saveData(); renderHud();
                setTimeout(() => { closeScreen('battleScreen'); checkDeath(); }, 1500);
            }
        }, 800);
    }

    function checkDeath() {
        if(state.deathTime && Date.now() < state.deathTime) {
            document.getElementById("deathOverlay").style.display = "flex";
            let diff = state.deathTime - Date.now();
            let h = Math.floor(diff/(3600000)), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById("countdownTimer").innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        } else {
            document.getElementById("deathOverlay").style.display = "none";
        }
    }

    function useReviveInstant() {
        if(state.reviveStock > 0) {
            state.reviveStock--; state.deathTime = null; state.hp = Math.floor(state.maxHp * 0.5);
            saveData(); renderHud();
        }
    }

    /* 📊 LEADERBOARD SINKRONISASI REALTIME */
    function openLeaderboardScreen() {
        openScreen('leaderboardScreen');
        switchTab('streak');
    }

    function switchTab(type) {
        document.getElementById("tabS").classList.remove("active-tab");
        document.getElementById("tabH").classList.remove("active-tab");
        document.getElementById("tabL").classList.remove("active-tab");
        
        let label = ""; let val = "";
        if(type === 'streak') { document.getElementById("tabS").classList.add("active-tab"); label = "Streak"; val = state.highestStreak + " Strk"; }
        if(type === 'hunt') { document.getElementById("tabH").classList.add("active-tab"); label = "Hunted"; val = state.totalHunts + " Hunts"; }
        if(type === 'lvl') { document.getElementById("tabL").classList.add("active-tab"); label = "Pet Lvl"; val = "Lvl " + state.level; }

        const container = document.getElementById("leaderboardContainer");
        // Inject data static presisi sesuai screenshot pertama (#1 BladeS)
        container.innerHTML = `
            <div class="rank-row" style="background: rgba(0, 255, 255, 0.08); border: 1px solid #00ffff; border-radius:4px;">
                <div class="rank-num" style="color:#00ffff;">#1</div>
                <div class="rank-name" style="color:#fffb00; font-weight:bold;">BladeS</div>
                <div class="rank-val">${val}</div>
            </div>
            <div class="rank-row">
                <div class="rank-num">#2</div>
                <div class="rank-name">Core_Dominion</div>
                <div class="rank-val">0 ${label}</div>
            </div>
        `;
    }

    // ====================================================================
    // 🔥 PERBAIKAN UTAMA: Navigasi Back Mendobrak Iframe Keluar Mulus
    // ====================================================================
    function closeLeaderboardAndGoHome() {
        closeScreen('leaderboardScreen'); // Sembunyikan layer leaderboard internal game
        
        // Perintah keluar menembus kungkungan Iframe menuju index.html utama
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'BEAST_NAVIGATE_BACK' }, '*');
        }
    }

    /* 🕹️ PHYSICS LOGIC DRAG PET */
    let pet = null; let wrapper = null; let isDragging = false;
    let px = 0, py = 0, vx = 0, vy = 0, lastX = 0, lastY = 0;

    function initPhysics() {
        pet = document.getElementById("petActor"); wrapper = document.getElementById("windowBox");
        px = (wrapper.clientWidth/2) - 75; py = (wrapper.clientHeight/2) - 75;
        pet.style.left = px + "px"; pet.style.top = py + "px";
        
        pet.addEventListener("mousedown", (e) => { isDragging = true; lastX = e.pageX; lastY = e.pageY; pet.classList.remove("pet-floating-anim"); });
        window.addEventListener("mousemove", (e) => {
            if(!isDragging) return;
            let dx = e.pageX - lastX; let dy = e.pageY - lastY;
            px += dx; py += dy;
            pet.style.left = px + "px"; pet.style.top = py + "px";
            vx = dx; vy = dy; lastX = e.pageX; lastY = e.pageY;
        });
        window.addEventListener("mouseup", () => { if(isDragging) { isDragging = false; pet.classList.add("pet-floating-anim"); } });
        
        setInterval(() => {
            if(isDragging) return;
            vx *= 0.95; vy *= 0.95;
            let cx = (wrapper.clientWidth/2) - 75; let cy = (wrapper.clientHeight/2) - 75;
            px += vx + (cx - px) * 0.05; py += vy + (cy - py) * 0.05;
            pet.style.left = px + "px"; pet.style.top = py + "px";
        }, 1000/60);
    }

    function openScreen(id) { document.getElementById(id).style.display = "flex"; }
    function closeScreen(id) { document.getElementById(id).style.display = "none"; }

    window.addEventListener("load", loadData);
</script>
</body>
</html>
