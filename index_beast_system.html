<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLDS | Beast Engine Auto-Sync System</title>
<style>
body {
  background: transparent; color: #fff;
  font-family: 'Courier New', Courier, monospace;
  margin: 0; padding: 10px;
  overflow: hidden; box-sizing: border-box;
}
.main-wrapper {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: #020205; border-radius: 8px;
  height: 660px; position: relative;
  overflow: hidden; box-sizing: border-box;
}

/* 🧭 NAVIGATION */
.top-nav-container {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: flex-start; z-index: 100;
  gap: 10px;
}
.nav-left { display: flex; flex-direction: column; gap: 6px; }
.nav-btn {
  background: rgba(0,0,0,0.75); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 4px;
  font-family: inherit; text-transform: uppercase; transition: all 0.2s;
  white-space: nowrap;
}
.nav-btn:hover:not(:disabled) { background: #fff; color: #000; }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 📊 HUD STATUS SYSTEM */
.status-panel {
  background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px 10px; border-radius: 6px; width: 145px; font-size: 10px;
}
.bar-row { margin-bottom: 5px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
.bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

/* 🐉 HUB TENGAH */
.pet-center-stage {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10; pointer-events: none;
}
.pet-draggable-area {
  width: 170px; height: 170px; display: flex; align-items: center; justify-content: center;
  cursor: grab; pointer-events: auto; position: relative;
  transition: transform 0.1s ease;
}
.pet-main-graphic {
  width: 100%; height: 100%; object-fit: contain;
  animation: petIdleFloat 3.5s infinite ease-in-out;
  user-select: none; -webkit-user-drag: none;
}
@keyframes petIdleFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.02); }
}
.pet-title-container {
  display: flex; align-items: center; gap: 6px; margin-top: 12px; pointer-events: auto;
}
.pet-title-tag {
  font-size: 12px; font-weight: bold; letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255,255,255,0.4); text-align: center;
}
.btn-rename {
  background: none; border: none; color: #00ff00; cursor: pointer; font-size: 12px; padding: 2px;
}

/* 🎒 BAG & FEEDING CONTROLLER */
.bottom-controls {
  position: absolute; bottom: 15px; left: 15px; right: 15px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 100;
}
.inventory-belt {
  display: flex; gap: 6px; background: rgba(0,0,0,0.8);
  padding: 6px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15);
}
.food-slot {
  width: 36px; height: 36px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  cursor: pointer; position: relative; transition: transform 0.2s;
}
.food-slot:hover { transform: scale(1.1); border-color: #fff; }
.food-count {
  position: absolute; bottom: -2px; right: -2px; background: #fff; color: #000;
  font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 6px;
}

/* ⚔️ SCREEN OVERLAYS & RPG PANEL */
.screen-overlay {
  position: absolute; inset: 0; background: #020206; z-index: 500;
  display: none; flex-direction: column; padding: 15px; box-sizing: border-box;
}
.battle-arena-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 40px 0 10px 0;
}
.fighter-card {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
  padding: 10px; border-radius: 6px; text-align: center; position: relative;
}
.fighter-img { width: 65px; height: 65px; object-fit: contain; margin-bottom: 6px; }
.rarity-tag { font-size: 8px; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
.element-badge {
  position: absolute; top: 6px; right: 6px; font-size: 10px;
  background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);
}

.combat-log-screen {
  background: #000; border: 1px solid rgba(255,255,255,0.1); height: 110px;
  overflow-y: auto; padding: 8px; font-size: 10px; color: #00ff00; border-radius: 4px; margin-bottom: 10px;
}

/* 🎮 RPG ACTION BOARD */
.rpg-action-board {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto;
}
.skill-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 8px; font-family: inherit; font-size: 10px; text-align: left;
  cursor: pointer; border-radius: 4px; display: flex; flex-direction: column; justify-content: center;
}
.skill-btn:hover:not(:disabled) { background: #fff; color: #000; border-color: #fff; }
.skill-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.skill-meta { font-size: 8px; opacity: 0.6; margin-top: 2px; }

.battle-item-subpanel {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2);
  padding: 8px; border-radius: 6px; margin-top: 8px; display: none;
}

/* ⏳ COOLDOWN LAYERS */
.cooldown-blocker {
  position: absolute; inset: 0; background: rgba(2,2,6,0.95); z-index: 999;
  display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
}
</style>
</head>
<body>

<div class="cooldown-blocker" id="deathOverlay">
  <div style="font-size: 32px; margin-bottom: 10px;">💀</div>
  <div style="font-size: 14px; font-weight: bold; color: #ff4a4a; letter-spacing: 1px;">BEAST INCAPACITATED</div>
  <div id="countdownTimer" style="font-size: 18px; font-weight: bold; color: #ffff00; margin-bottom: 15px;">05:00:00</div>
  <div style="display:flex; flex-direction:column; gap:8px; width: 180px;">
    <button class="nav-btn" style="border-color: #00ffff; color: #00ffff;" onclick="useReviveInstant()">💉 Revive Instant (<span id="death-revive-stock">0</span>)</button>
    <button class="nav-btn" style="opacity:0.5; font-size:9px;" onclick="bypassCooldown()">⚡ Owner Bypass</button>
  </div>
</div>

<div class="main-wrapper">
  
  <div class="top-nav-container">
    <div class="nav-left">
      <button class="nav-btn" onclick="openScreen('bestiaryScreen')">📖 Bestiary</button>
      <button class="nav-btn" style="border-color:#00ff00; color:#00ff00; font-weight:bold;" onclick="openScreen('ownerScreen'); syncOwnerFields();">🛠️ Owner Panel</button>
    </div>
    
    <div class="status-panel" id="mainStatusHud">
      <div class="bar-row">
        <div class="bar-label"><span>HP</span><span id="txtHp">100/100</span></div>
        <div class="bar-bg"><div class="bar-fill" id="fillHp" style="background:#ff4a4a;"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Hunger</span><span id="txtHunger">100/100</span></div>
        <div class="bar-bg"><div class="bar-fill" id="fillHunger" style="background:#ffa500;"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>EXP</span><span id="txtExp">0%</span></div>
        <div class="bar-bg"><div class="bar-fill" id="fillExp" style="background:#00ff00; width:0%;"></div></div>
      </div>
    </div>
  </div>

  <div class="pet-center-stage" id="mainStage">
    <div class="pet-draggable-area" id="petActor" onclick="handlePetClick()">
      <img id="petGraphicFile" class="pet-main-graphic" src="Telor.png" alt="Pet Graphic">
    </div>
    
    <div class="pet-title-container">
      <div class="pet-title-tag" id="petLabelTag">Loading Profile...</div>
      <button class="btn-rename" id="btnRenamePet" onclick="triggerRenamePet()">✏️</button>
    </div>
    
    <button class="nav-btn" id="huntWildTopBtn" style="margin-top:12px; border-color:#ff4a4a; color:#ff4a4a; pointer-events:auto;" onclick="openScreen('battleScreen'); prepareBattle();">⚔️ Hunt Wild</button>
  </div>

  <div class="bottom-controls" id="mainBottomControls">
    <div class="inventory-belt">
      <div class="food-slot" onclick="feedPet('apple')">🍎<span class="food-count" id="count-apple">0</span></div>
      <div class="food-slot" onclick="feedPet('candy')">🍬<span class="food-count" id="count-candy">0</span></div>
      <div class="food-slot" onclick="feedPet('juice')">🧃<span class="food-count" id="count-juice">0</span></div>
      <div class="food-slot" onclick="feedPet('bread')">🍞<span class="food-count" id="count-bread">0</span></div>
      <div class="food-slot" onclick="feedPet('burger')">🍔<span class="food-count" id="count-burger">0</span></div>
      <div class="food-slot" onclick="feedPet('pizza')">🍕<span class="food-count" id="count-pizza">0</span></div>
      <div class="food-slot" style="border-color: #00ffff;" onclick="useFullElixir()">🧪<span class="food-count" id="count-elixir" style="background:#00ffff;">0</span></div>
    </div>
  </div>

  <div class="screen-overlay" id="battleScreen">
    <div class="top-nav-container" style="position:static; margin-bottom:5px;">
      <button class="nav-btn" id="btnExitBattle" onclick="closeScreen('battleScreen')">⬅️ Run</button>
      <div id="combatTurnTitle" style="font-size:11px; font-weight:bold; color:#ff4a4a; margin-top:5px;">Your Turn</div>
    </div>
    
    <div class="battle-arena-grid">
      <div class="fighter-card">
        <span class="element-badge" id="btPlayerElement">💧</span>
        <img id="btPlayerImg" class="fighter-img" src="Ikan5.png" alt="Player">
        <div id="btPlayerName" style="font-size:11px; font-weight:bold;">Pet</div>
        <div id="btPlayerHp" style="font-size:10px; opacity:0.6; margin-top:4px;">100/100 HP</div>
      </div>
      <div class="fighter-card">
        <span class="element-badge" id="btEnemyElement">🔥</span>
        <img id="btEnemyImg" class="fighter-img" src="Serigala1.png" alt="Enemy">
        <div id="btEnemyName" style="font-size:11px; font-weight:bold;">Opponent</div>
        <div id="btEnemyRarity" class="rarity-tag" style="background:#fff; color:#000; display:inline-block; margin-top:3px;">Common</div>
        <div id="btEnemyHp" style="font-size:10px; opacity:0.6; margin-top:4px;">50/50 HP</div>
      </div>
    </div>
    
    <div class="combat-log-screen" id="battleLogBox"></div>
    
    <div class="rpg-action-board" id="rpgActionBoard">
      <button class="skill-btn" id="skillBtn0" onclick="executeRpgTurn(0)">
        <span>💥 Strike</span>
        <span class="skill-meta" id="skillDmg0">Dmg: --</span>
      </button>
      <button class="skill-btn" id="skillBtn1" onclick="executeRpgTurn(1)">
        <span>🔨 Heavy Smash</span>
        <span class="skill-meta" id="skillDmg1">Dmg: -- [CD: 0]</span>
      </button>
      <button class="skill-btn" id="skillBtn2" onclick="executeRpgTurn(2)">
        <span>⚡ Electro Stun</span>
        <span class="skill-meta" id="skillDmg2">Dmg: -- (50% Stun)</span>
      </button>
      <button class="skill-btn" id="skillBtn3" onclick="executeRpgTurn(3)">
        <span>🔥 Ulti Burst</span>
        <span class="skill-meta" id="skillDmg3">Dmg: -- [CD: 0]</span>
      </button>
    </div>
    
    <button class="nav-btn" id="btnToggleBattleItem" style="margin-top: 6px; width: 100%; border-color:#00ffff; color:#00ffff;" onclick="toggleBattleItemPanel()">🎒 Use Battle Item</button>
    
    <div class="battle-item-subpanel" id="battleItemPanel">
      <button class="nav-btn" style="font-size:10px;" onclick="useBattleItem('elixir')">🧪 Elixir (<span id="b-stock-elixir">0</span>)</button>
      <button class="nav-btn" style="font-size:10px;" onclick="useBattleItem('pill')">💊 Burst (<span id="b-stock-pill">0</span>)</button>
      <button class="nav-btn" style="font-size:10px; border-color:#ff4a4a; color:#ff4a4a;" onclick="toggleBattleItemPanel()">❌ Close</button>
    </div>
  </div>

  <div class="screen-overlay" id="bestiaryScreen">
    <div class="top-nav-container" style="position:static; margin-bottom:10px;">
      <button class="nav-btn" onclick="closeScreen('bestiaryScreen')">⬅️ Back</button>
      <div style="font-size:11px; font-weight:bold; color:#ffff00; margin-top:5px;">Bestiary Matrix</div>
    </div>
    <div class="grid-bestiary" id="bestiaryGridContainer"></div>
  </div>

  <div class="screen-overlay" id="ownerScreen" style="overflow-y:auto;">
    <div class="top-nav-container" style="position:static; margin-bottom:15px;">
      <button class="nav-btn" onclick="closeScreen('ownerScreen')">⬅️ Back</button>
      <div style="font-size:11px; font-weight:bold; color:#00ff00; margin-top:5px;">Cybernetic Owner Matrix</div>
    </div>

    <div style="background:rgba(255,255,255,0.02); border:1px solid rgba(0,255,0,0.2); padding:12px; border-radius:6px; margin-bottom:15px;">
      <div style="font-size:11px; font-weight:bold; color:#00ff00; margin-bottom:10px;">📊 OWNER MATRIX CONTROLLER</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="dev-form-group"><label>Set HP</label><input type="number" id="inpDevHp" class="dev-input"></div>
        <div class="dev-form-group"><label>Set Max HP</label><input type="number" id="inpDevMaxHp" class="dev-input"></div>
        <div class="dev-form-group"><label>Set Attack Power</label><input type="number" id="inpDevPower" class="dev-input"></div>
        <div class="dev-form-group"><label>Set Current EXP</label><input type="number" id="inpDevExp" class="dev-input"></div>
      </div>
      <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
        <button class="nav-btn" style="border-color:#00ff00; color:#00ff00; width:100%;" onclick="applyOwnerPetStats()">Inject Core Status</button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
          <button class="nav-btn btn-danger" onclick="resetOwnerAction('core_stats')">Reset Stats Only</button>
          <button class="nav-btn btn-danger" onclick="resetOwnerAction('streak')">Reset Streak Only</button>
        </div>
      </div>
    </div>

    <div style="background:rgba(255,255,255,0.02); border:1px solid rgba(0,255,0,0.2); padding:12px; border-radius:6px; margin-bottom:15px;">
      <div style="font-size:11px; font-weight:bold; color:#00ff00; margin-bottom:10px;">📦 INVENTORY ITEM GENERATOR</div>
      <div class="dev-form-group"><label>Quantity</label><input type="number" id="inpDevLootQty" class="dev-input" value="50"></div>
      <button class="nav-btn" style="width:100%; border-color:#00ff00; color:#00ff00;" onclick="generateOwnerLoot()">Inject Items Stock</button>
    </div>
  </div>
</div>

<script>
// State Utama
let stateData = {
  isHatched: true,
  hatchStreak: 2,
  activePetName: "Ikan5", // 🔴 DIUBAH OTOMATIS MENGIKUTI SRENSHOT USER
  activePetElement: "Water", // Ikan = Water, Naga = Fire, Serigala = Earth
  customPetName: "", 
  level: 10,                 // 🔴 DIUBAH KE LVL 10 SESUAI PROFIL USER
  hp: 100, maxHp: 100,
  hunger: 100, maxHunger: 100,
  exp: 0, maxExp: 400,
  power: 55,                 // Power disesuaikan lvl 10
  currentStreak: 0, highestStreak: 0,
  deathTimestamp: null
};

let foodBag = { apple: 3, candy: 2, juice: 3, bread: 1, burger: 0, pizza: 0, elixir: 0, pill: 2, revive: 1 };
let discoveredBeasts = ["Ikan5"]; 

const foodValues = {
  apple: { xp: 10, hp: 15, hunger: 20 }, candy: { xp: 15, hp: 10, hunger: 15 },
  juice: { xp: 20, hp: 20, hunger: 25 }, bread: { xp: 25, hp: 30, hunger: 35 },
  burger: { xp: 40, hp: 45, hunger: 50 }, pizza: { xp: 60, hp: 60, hunger: 65 }
};

const enemyPool = [
  { name: "Void Slime", rarity: "Common", multiplier: 1.0, chance: 0.35, img: "Serigala1.png", element: "Water" },
  { name: "Gorgon Larva", rarity: "Uncommon", multiplier: 1.2, chance: 0.25, img: "Ikan1.png", element: "Earth" },
  { name: "Shadow Basilisk", rarity: "Rare", multiplier: 1.6, chance: 0.20, img: "Ikan2.png", element: "Fire" },
  { name: "Inferno Drake", rarity: "Mythic", multiplier: 4.2, chance: 0.15, img: "Naga2.png", element: "Fire" }
];

const allBeastList = ["Naga1", "Naga2", "Ikan5", "Serigala1"];
let activeEnemy = null; let playerBattleHp = 0; let enemyBattleHp = 0;
let skillCooldowns = [0, 0, 0, 0]; let isEnemyStunned = false; let doubleDamageActive = false; 
const elementIcons = { Fire: "🔥", Water: "💧", Earth: "🌿" };

function saveLocalData() {
  localStorage.setItem("BLDS_STATE_SYSTEM", JSON.stringify(stateData));
  localStorage.setItem("BLDS_BEAST_BAG", JSON.stringify(foodBag));
  localStorage.setItem("BLDS_BEAST_DISCOVERED", JSON.stringify(discoveredBeasts));
}

// FIX UTAMA: Sync otomatis data agar tidak tertimpa variabel Telor default
function loadLocalData() {
  const s = localStorage.getItem("BLDS_STATE_SYSTEM"); 
  if(s) {
    stateData = JSON.parse(s);
  } else {
    // Jika data local kosong, paksa inisialisasi awal ke Ikan5 agar tidak balik jadi telur naga!
    stateData.activePetName = "Ikan5";
    stateData.activePetElement = "Water";
    stateData.level = 10;
    stateData.isHatched = true;
    saveLocalData();
  }
  const b = localStorage.getItem("BLDS_BEAST_BAG"); if(b) foodBag = JSON.parse(b);
  const d = localStorage.getItem("BLDS_BEAST_DISCOVERED"); if(d) discoveredBeasts = JSON.parse(d);
  if(!discoveredBeasts.includes(stateData.activePetName)) discoveredBeasts.push(stateData.activePetName);

  checkDeathCooldown();
  syncInterfaceGraphic();
  setInterval(checkDeathCooldown, 1000);
}

function syncInterfaceGraphic() {
  const graphicEl = document.getElementById("petGraphicFile");
  const labelEl = document.getElementById("petLabelTag");
  const huntBtn = document.getElementById("huntWildTopBtn");

  graphicEl.src = stateData.activePetName + ".png";
  let displayName = stateData.customPetName ? stateData.customPetName : `${stateData.activePetName}.png`;
  labelEl.innerHTML = `${elementIcons[stateData.activePetElement]} ${displayName} [Lvl ${stateData.level}]<br><span style="font-size:9px;color:#00ffff;">Streak: ${stateData.currentStreak} | High: ${stateData.highestStreak}</span>`;
  
  huntBtn.disabled = false;
  huntBtn.innerText = "⚔️ Hunt Wild";
  
  document.getElementById("death-revive-stock").innerText = foodBag.revive || 0;
  renderStats();
  updateInventoryCounters();
}

function renderStats() {
  document.getElementById("txtHp").innerText = `${stateData.hp}/${stateData.maxHp}`;
  document.getElementById("fillHp").style.width = `${(stateData.hp / stateData.maxHp) * 100}%`;
  document.getElementById("txtHunger").innerText = `${stateData.hunger}/${stateData.maxHunger}`;
  document.getElementById("fillHunger").style.width = `${(stateData.hunger / stateData.maxHunger) * 100}%`;
  document.getElementById("txtExp").innerText = `${Math.floor((stateData.exp / stateData.maxExp) * 100)}%`;
  document.getElementById("fillExp").style.width = `${(stateData.exp / stateData.maxExp) * 100}%`;
}

function updateInventoryCounters() {
  Object.keys(foodBag).forEach(key => {
    const el = document.getElementById(`count-${key}`); if(el) el.innerText = foodBag[key];
  });
}

function handlePetClick() {
  // Animasi/Suara feedback klik ringan
  const actor = document.getElementById("petActor");
  actor.style.transform = "scale(0.95)";
  setTimeout(() => actor.style.transform = "scale(1)", 100);
}

// ⚔️ ENGINE STRATEGI TURN-BASED COUNTER
function checkElementCounter(attackerEle, defenderEle) {
  if (attackerEle === "Water" && defenderEle === "Fire") return 1.5; // Air menang vs Api (+50% Dmg)
  if (attackerEle === "Fire" && defenderEle === "Earth") return 1.5; // Api menang vs Bumi
  if (attackerEle === "Earth" && defenderEle === "Water") return 1.5; // Bumi menang vs Air
  return 1.0;
}

function prepareBattle() {
  activeEnemy = getRandomEnemy();
  const lvlMod = Math.floor(stateData.level * (0.8 + Math.random() * 0.3)) || 1;
  activeEnemy.maxHp = Math.floor((50 + (lvlMod * 8)) * activeEnemy.multiplier);
  activeEnemy.hp = activeEnemy.maxHp;
  activeEnemy.dmg = Math.floor((6 + (lvlMod * 2)) * activeEnemy.multiplier);
  
  playerBattleHp = stateData.hp;
  enemyBattleHp = activeEnemy.hp;
  skillCooldowns = [0, 0, 0, 0];
  isEnemyStunned = false; doubleDamageActive = false;

  document.getElementById("btPlayerImg").src = stateData.activePetName + ".png";
  document.getElementById("btPlayerName").innerText = stateData.customPetName || stateData.activePetName;
  document.getElementById("btPlayerElement").innerText = elementIcons[stateData.activePetElement];
  
  document.getElementById("btEnemyImg").src = activeEnemy.img;
  document.getElementById("btEnemyName").innerText = `${activeEnemy.name} [Lvl ${lvlMod}]`;
  document.getElementById("btEnemyElement").innerText = elementIcons[activeEnemy.element];
  document.getElementById("btEnemyRarity").innerText = activeEnemy.rarity;
  
  document.getElementById("battleLogBox").innerHTML = `<div style='color:#ffff00;'>Entering battle matrix. Choose your skill!</div>`;
  document.getElementById("btnExitBattle").innerText = "⬅️ Run";
  updateRpgActionButtons();
}

function updateRpgActionButtons() {
  document.getElementById("btPlayerHp").innerText = `${playerBattleHp}/${stateData.maxHp} HP`;
  document.getElementById("btEnemyHp").innerText = `${enemyBattleHp}/${activeEnemy.maxHp} HP`;

  let pMod = checkElementCounter(stateData.activePetElement, activeEnemy.element);
  
  // TAMPILKAN DAMAGE FIX SEBELUM DIPENCET
  let d0 = Math.floor(stateData.power * 1.0 * pMod);
  let d1 = Math.floor(stateData.power * 1.5 * pMod);
  let d2 = Math.floor(stateData.power * 0.5 * pMod);
  let d3 = Math.floor(stateData.power * 2.5 * pMod);

  document.getElementById("skillDmg0").innerText = `Dmg: ${d0} ${pMod > 1 ? '🔥Counter' : ''}`;
  document.getElementById("skillDmg1").innerText = `Dmg: ${d1} [CD: ${skillCooldowns[1]}]`;
  document.getElementById("skillDmg2").innerText = `Dmg: ${d2} (50% Stun)`;
  document.getElementById("skillDmg3").innerText = `Dmg: ${d3} [CD: ${skillCooldowns[3]}]`;

  for(let i=0; i<4; i++) {
    document.getElementById(`skillBtn${i}`).disabled = (skillCooldowns[i] > 0);
  }
  document.getElementById("b-stock-elixir").innerText = foodBag.elixir;
  document.getElementById("b-stock-pill").innerText = foodBag.pill;
}

function executeRpgTurn(skillIndex) {
  setRpgBoardInteractive(false);
  const log = document.getElementById("battleLogBox");
  
  let baseMult = 1.0;
  if (skillIndex === 1) { baseMult = 1.5; skillCooldowns[1] = 3; }
  if (skillIndex === 2) { baseMult = 0.5; }
  if (skillIndex === 3) { baseMult = 2.5; skillCooldowns[3] = 5; }
  
  let elementMod = checkElementCounter(stateData.activePetElement, activeEnemy.element);
  let rawDamage = Math.floor(stateData.power * baseMult * elementMod);
  
  if (doubleDamageActive) { rawDamage = rawDamage * 2; doubleDamageActive = false; }
  enemyBattleHp = Math.max(0, enemyBattleHp - rawDamage);
  
  let skillNames = ["Strike", "Heavy Smash", "Electro Stun", "Ultimate Burst"];
  log.innerHTML += `<div>⚔️ Used <b>${skillNames[skillIndex]}</b>! Deals <b style='color:#ffff00;'>${rawDamage}</b> damage.</div>`;
  if(elementMod > 1) log.innerHTML += `<div style='color:#00ff00;font-size:9px;'>↳ Element Counter! Damage Increased by 50%</div>`;

  if (skillIndex === 2 && Math.random() <= 0.50) {
    isEnemyStunned = true;
    log.innerHTML += `<div style='color:#00ffff;font-size:9px;'>↳ ⚡ STUN SUCCESSFUL! Enemy locked down.</div>`;
  }

  document.getElementById("btEnemyHp").innerText = `${enemyBattleHp}/${activeEnemy.maxHp} HP`;
  for(let i=0; i<4; i++) { if(i !== skillIndex && skillCooldowns[i] > 0) skillCooldowns[i]--; }

  if (enemyBattleHp <= 0) { handleBattleVictory(); return; }
  
  document.getElementById("combatTurnTitle").innerText = "Enemy Turn...";
  setTimeout(() => {
    if (isEnemyStunned) {
      log.innerHTML += `<div style='color:#00ffff;'>💤 Enemy is paralyzed! Turn skipped.</div>`;
      isEnemyStunned = false; endTurnCycle();
    } else {
      let eEleMod = checkElementCounter(activeEnemy.element, stateData.activePetElement);
      let enemyDmg = Math.floor(activeEnemy.dmg * eEleMod);
      playerBattleHp = Math.max(0, playerBattleHp - enemyDmg);
      
      log.innerHTML += `<div style='color:#ff4a4a;'>💥 Opponent counter-attacks! Took <b>${enemyDmg}</b> damage.</div>`;
      if(eEleMod > 1) log.innerHTML += `<div style='color:#ff4a4a;font-size:9px;'>↳ Weakness Exploded! Enemy elements counter you.</div>`;
      
      if (playerBattleHp <= 0) { handleBattleDefeat(); } else { endTurnCycle(); }
    }
  }, 1000);
}

function endTurnCycle() {
  document.getElementById("combatTurnTitle").innerText = "Your Turn";
  setRpgBoardInteractive(true); updateRpgActionButtons();
}

function setRpgBoardInteractive(active) {
  for(let i=0; i<4; i++) document.getElementById(`skillBtn${i}`).disabled = !active;
  document.getElementById("btnToggleBattleItem").disabled = !active;
}

function handleBattleVictory() {
  const log = document.getElementById("battleLogBox");
  stateData.currentStreak++;
  if (stateData.currentStreak > stateData.highestStreak) stateData.highestStreak = stateData.currentStreak;

  let expGained = Math.floor(stateData.maxExp * 0.25);
  stateData.exp += expGained;
  if(stateData.exp >= stateData.maxExp) { stateData.exp = 0; stateData.level++; stateData.power += 5; }
  
  let dropMessage = "";
  if (Math.random() <= 0.02) { // 2% Drop Chance Revive 💉
    foodBag.revive++;
    dropMessage = `<br><span style='color:#00ffff;font-weight:bold;'>💉 DRIPPED: Found 1x Revive Serum!</span>`;
  }

  log.innerHTML += `<div style='color:#00ff00;font-weight:bold;'>🏆 Clear! Earned ${expGained} EXP.${dropMessage}</div>`;
  document.getElementById("btnExitBattle").innerText = "⬅️ Exit Arena";
  stateData.hp = playerBattleHp;
  saveLocalData(); syncInterfaceGraphic();
}

function handleBattleDefeat() {
  const log = document.getElementById("battleLogBox");
  log.innerHTML += `<div style='color:#ff4a4a;font-weight:bold;'>❌ K.O. Matrix System down.</div>`;
  stateData.currentStreak = 0; stateData.hp = 0;
  stateData.deathTimestamp = Date.now() + (5 * 60 * 60 * 1000);
  saveLocalData(); syncInterfaceGraphic();
  setTimeout(() => { closeScreen('battleScreen'); checkDeathCooldown(); }, 1500);
}

function useReviveInstant() {
  if (foodBag.revive <= 0) return;
  foodBag.revive--; stateData.deathTimestamp = null;
  stateData.hp = Math.floor(stateData.maxHp * 0.5); // HP pulih 50%
  saveLocalData(); syncInterfaceGraphic();
}

function checkDeathCooldown() {
  if (stateData.deathTimestamp && Date.now() < stateData.deathTimestamp) {
    document.getElementById("deathOverlay").style.display = "flex";
    let diff = stateData.deathTimestamp - Date.now();
    let hours = Math.floor(diff / (1000 * 60 * 60)), mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)), secs = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById("countdownTimer").innerText = `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  } else {
    document.getElementById("deathOverlay").style.display = "none";
  }
}

function toggleBattleItemPanel() {
  const panel = document.getElementById("battleItemPanel");
  panel.style.display = (panel.style.display === "grid") ? "none" : "grid";
}

function useBattleItem(type) {
  if(type === 'elixir' && foodBag.elixir > 0) { foodBag.elixir--; playerBattleHp = stateData.maxHp; } 
  if(type === 'pill' && foodBag.pill > 0) { foodBag.pill--; doubleDamageActive = true; }
  toggleBattleItemPanel(); updateRpgActionButtons();
}

function getRandomEnemy() { return Object.assign({}, enemyPool[Math.floor(Math.random() * enemyPool.length)]); }
function syncOwnerFields() {
  document.getElementById("inpDevHp").value = stateData.hp;
  document.getElementById("inpDevMaxHp").value = stateData.maxHp;
  document.getElementById("inpDevPower").value = stateData.power;
  document.getElementById("inpDevExp").value = stateData.exp;
}
function applyOwnerPetStats() {
  stateData.maxHp = parseInt(document.getElementById("inpDevMaxHp").value) || 100;
  stateData.hp = parseInt(document.getElementById("inpDevHp").value) || 100;
  stateData.power = parseInt(document.getElementById("inpDevPower").value) || 15;
  saveLocalData(); syncInterfaceGraphic(); alert("Core Modified!");
}
function generateOwnerLoot() {
  const qty = parseInt(document.getElementById("inpDevLootQty").value) || 10;
  Object.keys(foodBag).forEach(key => { foodBag[key] = qty; });
  saveLocalData(); updateInventoryCounters(); alert("Items Injected!");
}
function bypassCooldown() { stateData.deathTimestamp = null; stateData.hp = stateData.maxHp; saveLocalData(); syncInterfaceGraphic(); }
function resetOwnerAction(t) { if(t==='core_stats') { stateData.hp=100; stateData.level=10; stateData.activePetName="Ikan5"; } saveLocalData(); syncInterfaceGraphic(); }
function openScreen(id) { document.getElementById(id).style.display = "flex"; }
function closeScreen(id) { document.getElementById(id).style.display = "none"; }

window.addEventListener("load", () => { loadLocalData(); });
</script>
</body>
</html>
