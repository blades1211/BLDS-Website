<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAST ENGINE MODULE</title>
<style>
body {
  margin: 0;
  padding: 10px;
  background: #020205;
  color: #fff;
  font-family: 'Courier New', Courier, monospace;
  overflow: hidden; /* Mencegah bug scrollbar ganda di dalam iframe */
  box-sizing: border-box;
}
.beast-container {
  border: 1px dashed rgba(255,255,255,0.2);
  padding: 20px;
  text-align: center;
  background: rgba(255,255,255,0.01);
  height: 540px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-sizing: border-box;
}
.status-node {
  background: rgba(255, 0, 0, 0.05);
  border: 1px solid rgba(255, 0, 0, 0.2);
  padding: 10px;
  font-size: 12px;
  color: #ff5555;
}
.status-node.active {
  background: rgba(0, 255, 0, 0.05);
  border: 1px solid rgba(0, 255, 0, 0.2);
  color: #55ff55;
}
.grid-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.btn-engine {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 15px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  text-transform: uppercase;
}
.btn-engine:hover {
  background: #fff;
  color: #000;
}
.console-log {
  background: #000;
  border: 1px solid rgba(255,255,255,0.1);
  height: 150px;
  overflow-y: auto;
  text-align: left;
  padding: 10px;
  font-size: 11px;
  color: #00ff00;
}
</style>
</head>
<body>

<div class="beast-container">
  <div>
    <h3 style="margin-top:0; letter-spacing: 2px;">👾 BEAST CORE ENGINE v1.0</h3>
    <div class="status-node" id="engineStatus">ENGINE LINK DISCONNECTED // AWAITING SYSTEM INITIALIZATION</div>
  </div>

  <div style="margin: 15px 0;">
    <div style="font-size: 11px; opacity: 0.6; margin-bottom: 5px;">LINKED STREAK SYNC:</div>
    <div id="linkedStreakDisplay" style="font-size: 20px; font-weight: bold; letter-spacing: 3px;">-- DAYS</div>
  </div>

  <div class="console-log" id="consoleLog">
    [SYSTEM] Beast Engine standby.<br>
    [SYSTEM] Requesting telemetry from core...
  </div>

  <div class="grid-actions">
    <button class="btn-engine" onclick="triggerAction('ALPHA')">Execute Node Alpha</button>
    <button class="btn-engine" onclick="triggerAction('OMEGA')">Overdrive Pulse</button>
  </div>
</div>

<script>
function logToConsole(message) {
  const consoleLog = document.getElementById("consoleLog");
  consoleLog.innerHTML += `[BEAST] ${message}<br>`;
  consoleLog.scrollTop = consoleLog.scrollHeight;
}

function triggerAction(nodeName) {
  logToConsole(`Executing action on sequence: ${nodeName}...`);
  // Logika sistem tambahan bisa ditaruh di sini
}

// Mendengarkan kiriman data dari Core System utama
window.addEventListener("message", function(event) {
  if (event.data && event.data.type === 'STREAK_UPDATE') {
    const coreData = event.data.data;
    document.getElementById("linkedStreakDisplay").innerText = `${coreData.count} DAYS`;
    
    const statusNode = document.getElementById("engineStatus");
    statusNode.innerText = `ENGINE ONLINE // LINKED TO DOMINION: ${coreData.dominionName.toUpperCase()}`;
    statusNode.classList.add("active");
    
    logToConsole(`Telemetry synchronized. Active Streak: ${coreData.count}.`);
  }
});

// Meminta data awal ke core saat sistem dimuat di dalam iframe
window.onload = function() {
  window.parent.postMessage({ type: 'REQUEST_STREAK_DATA' }, '*');
};
</script>
</body>
</html>
