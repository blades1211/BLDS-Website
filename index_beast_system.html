<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLDS | Beast Engine Premium Core</title>
<style>
body {
  background: transparent; color: #fff;
  font-family: 'Courier New', Courier, monospace;
  margin: 0; padding: 10px;
  overflow: hidden; box-sizing: border-box;
  user-select: none;
}
.main-wrapper {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: #020205; border-radius: 8px;
  height: 660px; position: relative;
  overflow: hidden; box-sizing: border-box;
}

/* 🧭 NAVIGATION & HUD */
.top-nav-container {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: flex-start; z-index: 100;
  gap: 10px; pointer-events: none;
}
.nav-left { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.nav-btn {
  background: rgba(0,0,0,0.85); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 4px;
  font-family: inherit; text-transform: uppercase; transition: all 0.2s;
  white-space: nowrap;
}
.nav-btn:hover:not(:disabled) { background: #fff; color: #000; }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.status-panel {
  background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px 10px; border-radius: 6px; width: 145px; font-size: 10px; pointer-events: auto;
}
.bar-row { margin-bottom: 5px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
.bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

/* 🐉 PHYSICS SYSTEM STAGE */
.pet-center-stage {
  position: absolute; inset: 0; z-index: 10; pointer-events: none;
}
.pet-draggable-area {
  width: 150px; height: 150px; display: flex; align-items: center; justify-content: center;
  cursor: grab; pointer-events: auto; 
  position: absolute; 
  left: calc(50% - 75px); top: calc(50% - 75px);
  touch-action: none;
}
.pet-draggable-area:active { cursor: grabbing; }
.pet-main-graphic {
  width: 100%; height: 100%; object-fit: contain;
  user-select: none; -webkit-user-drag: none;
}
.pet-floating-anim {
  animation: petIdleFloat 3.5s infinite ease-in-out;
}
@keyframes petIdleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.static-title-hud {
  position: absolute; top: 220px; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 5; pointer-events: none;
}
.pet-title-tag {
  font-size: 13px; font-weight: bold; letter-spacing: 1px; line-height: 1.4;
  text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 5px rgba(0,255,255,0.4); text-align: center;
}
.hunt-trigger-wrapper {
  position: absolute; bottom: 85px; left: 0; right: 0;
  display: flex; justify-content: center; z-index: 90;
}

/* 🎒 INVENTORY */
.bottom-controls {
  position: absolute; bottom: 15px; left: 15px; right: 15px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 100;
}
.inventory-belt {
  display: flex; gap: 6px; background: rgba(0,0,0,0.85);
  padding: 6px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15);
}
.food-slot {
  width: 36px; height: 36px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  cursor: pointer; position: relative; transition: transform 0.2s;
}
.food-slot:hover { transform: scale(1.1); border-color: #fff; }
.food-count {
  position: absolute; bottom: -2px; right: -2px; background: #fff; color: #000;
  font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 6px;
}

/* ⚔️ SCREEN OVERLAYS */
.screen-overlay {
  position: absolute; inset: 0; background: #020206; z-index: 500;
  display: none; flex-direction: column; padding: 15px; box-sizing: border-box;
}
.battle-arena-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 40px 0 10px 0;
}
.fighter-card {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
  padding: 10px; border-radius: 6px; text-align: center; position: relative;
}
.fighter-img { width: 65px; height: 65px; object-fit: contain; margin-bottom: 6px; }
.rarity-tag { font-size: 8px; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
.element-badge {
  position: absolute; top: 6px; right: 6px; font-size: 10px;
  background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);
}
.combat-log-screen {
  background: #000; border: 1px solid rgba(255,255,255,0.1); height: 110px;
  overflow-y: auto; padding: 8px; font-size: 10px; color: #00ff00; border-radius: 4px; margin-bottom: 10px;
}
.rpg-action-board {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto;
}
.skill-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 8px; font-family: inherit; font-size: 10px; text-align: left;
  cursor: pointer; border-radius: 4px; display: flex; flex-direction: column; justify-content: center;
}
.skill-btn:hover:not(:disabled) { background: #fff; color: #000; border-color: #fff; }
.skill-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.skill-meta { font-size: 8px; opacity: 0.6; margin-top: 2px; }

.battle-item-subpanel {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2);
  padding: 8px; border-radius: 6px; margin-top: 8px; display: none;
}
.cooldown-blocker {
  position: absolute; inset: 0; background: rgba(2,2,6,0.95); z-index: 999;
  display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
}

/* 📊 TABBED LEADERBOARD SYSTEM */
.leaderboard-header-tabs {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px;
}
.tab-btn {
  background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.15);
  font-size: 9px; padding: 6px 2px; cursor: pointer; text-align: center; font-family: inherit;
  border-radius: 4px; text-transform: uppercase;
}
.tab-btn.active-tab {
  background: #fff; color: #000; border-color: #fff; font-weight: bold;
}
.leaderboard-scroll-area {
  flex-grow: 1; overflow-y: auto; background: #000; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px; padding: 6px; box-sizing: border-box;
}
.rank-row {
  display: grid; grid-template-columns: 30px 1fr 65px; padding: 6px 8px;
  font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center;
}
.rank-row:nth-child(1) { color: #ffea00; font-weight: bold; background: rgba(255,234,0,0.05); }
.rank-row:nth-child(2) { color: #cccccc; }
.rank-row:nth-child(3) { color: #b87333; }
.rank-num { font-weight: bold; opacity: 0.8; }
.rank-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-val { text-align: right; font-weight: bold; color: #00ffff; }

/* 🛡️ GATEKEEPER POPUP */
.gatekeeper-box {
  background: rgba(0,0,0,0.95); border: 1px solid #00ff00; padding: 15px;
  border-radius: 6px; text-align: center; width: 220px; margin: auto; margin-top: 150px;
}
.dev-input {
  background: #000; color: #00ff00; border: 1px solid #00ff00;
  padding: 6px; text-align: center; font-family: inherit; width: 90%;
  margin-bottom: 10px; border-radius: 4px; outline: none;
}
</style>
</head>

<script>
const petNamingRegistry = {
  "Telor": { title: "Void Egg", element: "Water" },
  "Ikan1": { title: "Glitter Fin", element: "Water" },
  "Ikan2": { title: "Aqua Brocade", element: "Water" },
  "Ikan3": { title: "Torrent Glimmer", element: "Water" },
  "Ikan4": { title: "Abyssal Koi", element: "Water" },
  "Ikan5": { title: "Aurelius Sovereign", element: "Water" },
  "Naga1": { title: "Pyre Hatchling", element: "Fire" },
  "Naga2": { title: "Ember Scale", element: "Fire" },
  "Naga3": { title: "Blaze Wing", element: "Fire" },
  "Naga4": { title: "Ignis Dread", element: "Fire" },
  "Naga5": { title: "Astral Sovereign", element: "Fire" },
  "Serigala1": { title: "Lupin Pup", element: "Earth" },
  "Serigala2": { title: "Wild Fang", element: "Earth" },
  "Serigala3": { title: "Alpha Claw", element: "Earth" },
  "Serigala4": { title: "Fenrir Shard", element: "Earth" },
  "Serigala5": { title: "Apex Sovereign", element: "Earth" }
};

let stateData = {
  isHatched: true,
  activePetFile: "Ikan5",
  level: 10,                 
  hp: 100, maxHp: 100,
  hunger: 100, maxHunger: 100,
  exp: 0, maxExp: 400,
  power: 65,                 
  currentStreak: 0, highestStreak: 0,
  totalHunts: 0, 
  deathTimestamp: null,
  dominionName: "Player"
};

let foodBag = { apple: 5, candy: 5, juice: 4, bread: 2, burger: 1, pizza: 1, elixir: 2, pill: 3, revive: 1 };
const foodValues = {
  apple: { xp: 10, hp: 15, hunger: 20 }, candy: { xp: 15, hp: 10, hunger: 15 },
  juice: { xp: 20, hp: 20, hunger: 25 }, bread: { xp: 25, hp: 30, hunger: 35 },
  burger: { xp: 40, hp: 45, hunger: 50 }, pizza: { xp: 60, hp: 60, hunger: 65 }
};

const enemyPool = [
  { name: "Lupin Pup Wild", multiplier: 1.0, img: "Serigala1.png", element: "Earth", rarity: "Common" },
  { name: "Glitter Fin Rogue", multiplier: 1.1, img: "Ikan1.png", element: "Water", rarity: "Common" },
  { name: "Aqua Brocade Mutant", multiplier: 1.4, img: "Ikan2.png", element: "Water", rarity: "Rare" },
  { name: "Ember Scale Drake", multiplier: 3.5, img: "Naga2.png", element: "Fire", rarity: "Mythic" }
];

const elementIcons = { Fire: "🔥", Water: "💧", Earth: "🌿" };
let currentActiveTab = 'streak';
const FIREBASE_DB_URL = "https://blds-beast-engine-default-rtdb.asia-southeast1.firebasedatabase.app";

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === 'TELEMETRY_UPDATE') {
    if (e.data.data && e.data.data.dominionName) {
      stateData.dominionName = e.data.data.dominionName;
      stateData.currentStreak = e.data.data.count;
      stateData.highestStreak = e.data.data.highestCount;
    }
    if (e.data.pet && e.data.pet.name) {
      stateData.activePetFile = e.data.pet.name;
    }
    saveLocalData();
    syncInterfaceGraphic();
  }
});

function saveLocalData() {
  localStorage.setItem("BLDS_GATE_STATE", JSON.stringify(stateData));
  localStorage.setItem("BLDS_GATE_BAG", JSON.stringify(foodBag));
}

function loadLocalData() {
  const s = localStorage.getItem("BLDS_GATE_STATE");
  if(s) {
    try { stateData = JSON.parse(s); } catch(e){}
  }
  const b = localStorage.getItem("BLDS_GATE_BAG"); 
  if(b) {
    try { foodBag = JSON.parse(b); } catch(e){}
  }

  // ⚙ *CODESURGERY FIX*: Eliminasi mekanisme pembacaan innerHTML yang rawan macet demi kestabilan runtime Vercel
  if(!s) {
    stateData.activePetFile = "Ikan5";
  }
  
  if(window.parent) { window.parent.postMessage({ type: 'BEAST_HANDSHAKE_REQ' }, '*'); }

  // Force close overlay keamanan di siklus render pertama
  closeScreen('gatekeeperScreen');
  closeScreen('ownerScreen');

  checkDeathCooldown();
  syncInterfaceGraphic();
  initPhysicsEngine(); 
  setInterval(checkDeathCooldown, 1000);
}

function verifyGatekeeperKey() {
  const field = document.getElementById("gatekeeperKeyField");
  if(field.value === "OWNERONLYBLDS") {
    field.value = "";
    closeScreen('gatekeeperScreen');
    openScreen('ownerScreen');
    syncOwnerFields();

    alert("INVALID ACCESS KEY MATRIX CODE!");
    field.value = "";

}

function openLeaderboardScreen() {
  openScreen('leaderboardScreen');
  switchLeaderboardTab(currentActiveTab);
}

function closeLeaderboardAndGoHome() {
  closeScreen('leaderboardScreen');
  if(window.parent) {
    window.parent.postMessage({ type: 'BEAST_NAVIGATE_BACK' }, '*');
  }
}

function switchLeaderboardTab(tab) {
  currentActiveTab = tab;
  document.getElementById("lblTabStreak").classList.remove("active-tab");
  document.getElementById("lblTabHunt").classList.remove("active-tab");
  document.getElementById("lblTabLevel").classList.remove("active-tab");

  if(tab === 'streak') document.getElementById("lblTabStreak").classList.add("active-tab");
  if(tab === 'hunt') document.getElementById("lblTabHunt").classList.add("active-tab");
  if(tab === 'level') document.getElementById("lblTabLevel").classList.add("active-tab");

  renderLeaderboardRows();
}

function renderLeaderboardRows() {
  const box = document.getElementById("leaderboardRowsContainer");
  box.innerHTML = `<div style="text-align:center; padding:20px; font-size:11px; opacity:0.5;">Loading live global matrix...</div>`;

  fetch(`${FIREBASE_DB_URL}/leaderboard.json`)
    .then(res => res.json())
    .then(cloudData => {
      let dataset = [];
      if (cloudData) {
        Object.keys(cloudData).forEach(key => {
          if (cloudData[key] && typeof cloudData[key] === 'object' && cloudData[key].displayName) {
            dataset.push({
              name: cloudData[key].displayName,
              streak: cloudData[key].streak || 0,
              hunt: cloudData[key].hunt || 0,
              level: cloudData[key].level || 1
            });
          }
        });
      }

      if (!dataset.some(u => u.name === stateData.dominionName)) {
        dataset.push({
          name: stateData.dominionName,
          streak: stateData.highestStreak,
          hunt: stateData.totalHunts,
          level: stateData.level
        });
      } else {
        dataset.forEach(u => {
          if(u.name === stateData.dominionName) {
            u.streak = Math.max(u.streak, stateData.highestStreak);
            u.hunt = Math.max(u.hunt, stateData.totalHunts);
            u.level = Math.max(u.level, stateData.level);
          }
        });
      }

      if(currentActiveTab === 'streak') dataset.sort((a,b) => b.streak - a.streak);
      if(currentActiveTab === 'hunt') dataset.sort((a,b) => b.hunt - a.hunt);
      if(currentActiveTab === 'level') dataset.sort((a,b) => b.level - a.level);

      box.innerHTML = "";
      const top20 = dataset.slice(0, 20);

      top20.forEach((user, index) => {
        let finalValueText = "";
        if(currentActiveTab === 'streak') finalValueText = `${user.streak} Strk`;
        if(currentActiveTab === 'hunt') finalValueText = `${user.hunt} Hunts`;
        if(currentActiveTab === 'level') finalValueText = `Lvl ${user.level}`;

        let rowStyle = (user.name === stateData.dominionName) ? "background:rgba(0,255,255,0.12); border:1px solid #00ffff;" : "";

        box.innerHTML += `
          <div class="rank-row" style="${rowStyle}">
            <div class="rank-num">#${index + 1}</div>
            <div class="rank-name">${user.name}</div>
            <div class="rank-val">${finalValueText}</div>
          </div>
        `;
      });
    })
    .catch(() => {
      box.innerHTML = `<div style="text-align:center; padding:20px; color:#ff4a4a; font-size:11px;">Failed to link cloud database matrix.</div>`;
    });
}

function syncInterfaceGraphic() {
  const activeLookup = petNamingRegistry[stateData.activePetFile] || { title: "Aurelius Sovereign", element: "Water" };
  document.getElementById("petGraphicFile").src = stateData.activePetFile + ".png";
  document.getElementById("petLabelTag").innerHTML = `${elementIcons[activeLookup.element] || "💧"} ${activeLookup.title} [Lvl ${stateData.level}]<br><span style="font-size:9px;color:#00ffff;">Streak: ${stateData.currentStreak} | High: ${stateData.highestStreak}</span>`;
  document.getElementById("death-revive-stock").innerText = foodBag.revive || 0;
  renderStats();
  updateInventoryCounters();
}

function renderStats() {
  document.getElementById("txtHp").innerText = `${stateData.hp}/${stateData.maxHp}`;
  document.getElementById("fillHp").style.width = `${(stateData.hp / stateData.maxHp) * 100}%`;
  document.getElementById("txtHunger").innerText = `${stateData.hunger}/${stateData.maxHunger}`;
  document.getElementById("fillHunger").style.width = `${(stateData.hunger / stateData.maxHunger) * 100}%`;
  document.getElementById("txtExp").innerText = `${Math.floor((stateData.exp / stateData.maxExp) * 100)}%`;
  document.getElementById("fillExp").style.width = `${(stateData.exp / stateData.maxExp) * 100}%`;
}

function updateInventoryCounters() {
  Object.keys(foodBag).forEach(key => {
    const el = document.getElementById(`count-${key}`); if(el) el.innerText = foodBag[key];
  });
}

function feedPet(item) {
  if (foodBag[item] <= 0 || stateData.hp <= 0) return;
  foodBag[item]--;
  
  const val = foodValues[item];
  stateData.hunger = Math.min(stateData.maxHunger, stateData.hunger + val.hunger);
  stateData.hp = Math.min(stateData.maxHp, stateData.hp + val.hp);
  stateData.exp += val.xp;
  
  if (stateData.exp >= stateData.maxExp) {
    stateData.exp = 0;
    stateData.level++;
    stateData.power += 6;
    stateData.maxHp += 15;
    stateData.hp = stateData.maxHp;
    pushUpdateToCloud();
  }
  
  saveLocalData();
  syncInterfaceGraphic();
  vy = -15; 
}

function useFullElixir() {
  if(foodBag.elixir <= 0) return;
  foodBag.elixir--; 
  stateData.hp = stateData.maxHp; 
  stateData.hunger = stateData.maxHunger;
  saveLocalData(); 
  syncInterfaceGraphic();
}

/* 🕹️ PHYSICS SYSTEM ENGINE */
let pet = null; let wrapper = null;
let isDragging = false;
let px = 0, py = 0, vx = 0, vy = 0;       
let lastMouseX = 0, lastMouseY = 0;
let dragOffsetX = 0, dragOffsetY = 0;

function initPhysicsEngine() {
  pet = document.getElementById("petActor");
  wrapper = document.getElementById("windowBox");
  px = (wrapper.clientWidth / 2) - (pet.clientWidth / 2);
  py = (wrapper.clientHeight / 2) - (pet.clientHeight / 2) + 20;
  
  pet.style.left = px + "px"; pet.style.top = py + "px";
  
  pet.addEventListener("mousedown", startDrag);
  window.addEventListener("mousemove", doDrag);
  window.addEventListener("mouseup", stopDrag);
  
  pet.addEventListener("touchstart", startDrag, {passive: false});
  window.addEventListener("touchmove", doDrag, {passive: false});
  window.addEventListener("touchend", stopDrag);
  
  setInterval(updatePhysicsFrame, 1000 / 60);
}

function startDrag(e) {
  isDragging = true;
  pet.classList.remove("pet-floating-anim"); 
  let pageX = e.pageX || e.touches[0].pageX;
  let pageY = e.pageY || e.touches[0].pageY;
  let rect = pet.getBoundingClientRect();
  dragOffsetX = pageX - (rect.left + window.scrollX);
  dragOffsetY = pageY - (rect.top + window.scrollY);
  lastMouseX = pageX; lastMouseY = pageY;
  vx = 0; vy = 0;
  if(e.cancelable) e.preventDefault();
}

function doDrag(e) {
  if (!isDragging) return;
  let pageX = e.pageX || e.touches[0].pageX;
  let pageY = e.pageY || e.touches[0].pageY;
  let wrapperRect = wrapper.getBoundingClientRect();
  let targetX = pageX - wrapperRect.left - dragOffsetX;
  let targetY = pageY - wrapperRect.top - dragOffsetY;
  let maxX = wrapper.clientWidth - pet.clientWidth;
  let maxY = wrapper.clientHeight - pet.clientHeight;

  if (targetX < 0) targetX = 0;
  if (targetX > maxX) targetX = maxX;
  if (targetY < 0) targetY = 0;
  if (targetY > maxY) targetY = maxY;

  px = targetX; py = targetY;
  pet.style.left = px + "px"; pet.style.top = py + "px";
  
  vx = pageX - lastMouseX; 
  vy = pageY - lastMouseY;
  lastMouseX = pageX; lastMouseY = pageY;
}

function stopDrag() { 
  if(isDragging) {
    isDragging = false;
  }
}

function updatePhysicsFrame() {
  if (isDragging) return; 
  let maxX = wrapper.clientWidth - pet.clientWidth;
  let maxY = wrapper.clientHeight - pet.clientHeight;
  let centerX = (wrapper.clientWidth / 2) - (pet.clientWidth / 2);
  let centerY = (wrapper.clientHeight / 2) - (pet.clientHeight / 2) + 20;

  vx *= 0.97; vy *= 0.97;
  px += vx; py += vy;

  if (Math.abs(vx) < 1.8 && Math.abs(vy) < 1.8) {
    px += (centerX - px) * 0.05; 
    py += (centerY - py) * 0.05;
    if(!pet.classList.contains("pet-floating-anim") && Math.abs(px - centerX) < 5) {
       pet.classList.add("pet-floating-anim");
    }
  }

  if (px < 0) { px = 0; vx *= -0.8; }
  if (px > maxX) { px = maxX; vx *= -0.8; }
  if (py < 0) { py = 0; vy *= -0.8; }
  if (py > maxY) { py = maxY; vy *= -0.8; }

  pet.style.left = px + "px"; pet.style.top = py + "px";
  let rotation = vx * 2;
  pet.style.transform = `rotate(${rotation}deg)`;
}

/* ⚔️ RPG COMBAT SYSTEM */
let activeEnemy = null; let playerBattleHp = 0; let enemyBattleHp = 0;
let skillCooldowns = [0, 0, 0, 0]; let isEnemyStunned = false; let doubleDamageActive = false;

function prepareBattle() {
  activeEnemy = enemyPool[Math.floor(Math.random() * enemyPool.length)];
  const lvlMod = Math.floor(stateData.level * (0.8 + Math.random() * 0.4)) || 1;
  activeEnemy.maxHp = Math.floor((55 + (lvlMod * 9)) * activeEnemy.multiplier);
  activeEnemy.hp = activeEnemy.maxHp;
  activeEnemy.dmg = Math.floor((7 + (lvlMod * 2)) * activeEnemy.multiplier);
  
  playerBattleHp = stateData.hp; enemyBattleHp = activeEnemy.hp;
  skillCooldowns = [0, 0, 0, 0]; isEnemyStunned = false; doubleDamageActive = false;

  const currentLookup = petNamingRegistry[stateData.activePetFile] || { title: "Beast", element: "Water" };
  document.getElementById("btPlayerImg").src = stateData.activePetFile + ".png";
  document.getElementById("btPlayerName").innerText = currentLookup.title;
  document.getElementById("btPlayerElement").innerText = elementIcons[currentLookup.element];
  
  document.getElementById("btEnemyImg").src = activeEnemy.img;
  document.getElementById("btEnemyName").innerText = `${activeEnemy.name} [Lvl ${lvlMod}]`;
  document.getElementById("btEnemyElement").innerText = elementIcons[activeEnemy.element];
  document.getElementById("btEnemyRarity").innerText = activeEnemy.rarity;
  
  document.getElementById("battleLogBox").innerHTML = `<div style='color:#ffff00;'>Battle Arena Loaded. Pilih Protocol Serangan!</div>`;
  document.getElementById("btnExitBattle").innerText = "⬅️ Run";
  updateRpgActionButtons();
}

function updateRpgActionButtons() {
  document.getElementById("btPlayerHp").innerText = `${playerBattleHp}/${stateData.maxHp} HP`;
  document.getElementById("btEnemyHp").innerText = `${enemyBattleHp}/${activeEnemy.maxHp} HP`;
  const currentLookup = petNamingRegistry[stateData.activePetFile] || { element: "Water" };
  let pMod = (currentLookup.element === "Water" && activeEnemy.element === "Fire") ? 1.5 : 1.0;
  
  document.getElementById("skillDmg0").innerText = `Dmg: ${Math.floor(stateData.power * 1.0 * pMod)}`;
  document.getElementById("skillDmg1").innerText = `Dmg: ${Math.floor(stateData.power * 1.5 * pMod)} [CD: ${skillCooldowns[1]}]`;
  document.getElementById("skillDmg2").innerText = `Dmg: ${Math.floor(stateData.power * 0.6 * pMod)} (50% Stun)`;
  document.getElementById("skillDmg3").innerText = `Dmg: ${Math.floor(stateData.power * 2.5 * pMod)} [CD: ${skillCooldowns[3]}]`;

  for(let i=0; i<4; i++) document.getElementById(`skillBtn${i}`).disabled = (skillCooldowns[i] > 0);
  document.getElementById("b-stock-elixir").innerText = foodBag.elixir;
  document.getElementById("b-stock-pill").innerText = foodBag.pill;
}

function executeRpgTurn(skillIndex) {
  setRpgBoardInteractive(false);
  const log = document.getElementById("battleLogBox");
  let baseMult = 1.0;
  
  if (skillIndex === 1) { baseMult = 1.5; skillCooldowns[1] = 2; }
  if (skillIndex === 2) { baseMult = 0.6; }
  if (skillIndex === 3) { baseMult = 2.5; skillCooldowns[3] = 4; }
  
  let rawDamage = Math.floor(stateData.power * baseMult);
  
  if (doubleDamageActive) { 
    rawDamage = rawDamage * 2; 
    doubleDamageActive = false; 
  }
  
  enemyBattleHp = Math.max(0, enemyBattleHp - rawDamage);
  
  let skillNames = ["Strike", "Heavy Smash", "Electro Stun", "Ultimate Burst"];
  log.innerHTML += `<div>⚔️ Pet melepas <b>${skillNames[skillIndex]}</b>! Menghasilkan <b style='color:#ffff00;'>${rawDamage}</b> dmg.</div>`;

  if (skillIndex === 2 && Math.random() <= 0.50) {
    isEnemyStunned = true; 
    log.innerHTML += `<div style='color:#00ffff;font-size:9px;'>↳ ⚡ PARALYZED! Turn musuh akan terlewati.</div>`;
  }

  for(let i=0; i<4; i++) { 
    if(i !== skillIndex && skillCooldowns[i] > 0) skillCooldowns[i]--; 
  }
  
  if (enemyBattleHp <= 0) { handleBattleVictory(); return; }
  
  setTimeout(() => {
    if (isEnemyStunned) {
      log.innerHTML += `<div style='color:#00ffff;'>💤 Musuh Terbujur Kaku! Aksi mereka ter-skip.</div>`;
      isEnemyStunned = false; 
      endTurnCycle();
    } else {
      let enemyDmg = activeEnemy.dmg;
      playerBattleHp = Math.max(0, playerBattleHp - enemyDmg);
      log.innerHTML += `<div style='color:#ff4a4a;'>💥 Musuh membalas hantaman! Menerima <b>${enemyDmg}</b> damage.</div>`;
      if (playerBattleHp <= 0) { handleBattleDefeat(); } else { endTurnCycle(); }
    }
  }, 1000);
}

function endTurnCycle() { 
  document.getElementById("combatTurnTitle").innerText = "Your Turn"; 
  setRpgBoardInteractive(true); 
  updateRpgActionButtons(); 
}

function setRpgBoardInteractive(act) { 
  for(let i=0; i<4; i++) {
    if(act && skillCooldowns[i] > 0) continue;
    document.getElementById(`skillBtn${i}`).disabled = !act; 
  }
}

function handleBattleVictory() {
  const log = document.getElementById("battleLogBox");
  stateData.currentStreak++;
  stateData.totalHunts++; 
  if (stateData.currentStreak > stateData.highestStreak) stateData.highestStreak = stateData.currentStreak;

  let expGained = Math.floor(stateData.maxExp * 0.35);
  stateData.exp += expGained;
  if(stateData.exp >= stateData.maxExp) { 
    stateData.exp = 0; 
    stateData.level++; 
    stateData.power += 6; 
    stateData.maxHp += 15;
  }
  
  log.innerHTML += `<div style='color:#00ff00;font-weight:bold;'>🏆 Victory! Mendapat ${expGained} EXP.</div>`;
  document.getElementById("btnExitBattle").innerText = "⬅ nighttime; Keluar Arena";
  stateData.hp = playerBattleHp;
  
  saveLocalData(); 
  syncInterfaceGraphic();
  pushUpdateToCloud();
}

function handleBattleDefeat() {
  stateData.currentStreak = 0; stateData.hp = 0;
  stateData.deathTimestamp = Date.now() + (5 * 60 * 60 * 1000);
  saveLocalData(); syncInterfaceGraphic(); pushUpdateToCloud();
  setTimeout(() => { closeScreen('battleScreen'); checkDeathCooldown(); }, 1500);
}

function pushUpdateToCloud() {
  if (!stateData.dominionName || stateData.dominionName === "Player") return;
  const secureKey = stateData.dominionName.replace(/[.#$\[\]]/g, "_");
  const payload = {
    username: secureKey,
    displayName: stateData.dominionName,
    streak: stateData.highestStreak,
    hunt: stateData.totalHunts,
    level: stateData.level
  };
  fetch(`${FIREBASE_DB_URL}/leaderboard/${secureKey}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(err => console.error("Koneksi Firebase terhambat:", err));
}

function checkDeathCooldown() {
  if (stateData.deathTimestamp && Date.now() < stateData.deathTimestamp) {
    document.getElementById("deathOverlay").style.display = "flex";
    let diff = stateData.deathTimestamp - Date.now();
    let hours = Math.floor(diff / (1000 * 60 * 60)), mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)), secs = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById("countdownTimer").innerText = `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  } else { document.getElementById("deathOverlay").style.display = "none"; }
}

function useReviveInstant() {
  if (foodBag.revive <= 0) return;
  foodBag.revive--; stateData.deathTimestamp = null; stateData.hp = Math.floor(stateData.maxHp * 0.5);
  saveLocalData(); syncInterfaceGraphic();
}

function toggleBattleItemPanel() {
  const panel = document.getElementById("battleItemPanel");
  panel.style.display = (panel.style.display === "grid") ? "none" : "grid";
}

function useBattleItem(type) {
  const log = document.getElementById("battleLogBox");
  if(type === 'elixir') {
    if(foodBag.elixir > 0) {
      foodBag.elixir--;
      playerBattleHp = stateData.maxHp; 
      log.innerHTML += `<div style='color:#00ffff;'>🧪 Menggunakan Elixir! HP Pet pulih 100% penuh!</div>`;
    } else {
      alert("Stok Elixir Habis!");
    }
  }
  if(type === 'pill') {
    if(foodBag.pill > 0) {
      foodBag.pill--;
      doubleDamageActive = true; 
      log.innerHTML += `<div style='color:#ff00ff;'>💊 Menggunakan Burst Pill! Serangan berikutnya akan menghasilkan 2x LIPAT DAMAGE!</div>`;
    } else {
      alert("Stok Burst Pill Habis!");
    }
  }
  toggleBattleItemPanel(); 
  updateRpgActionButtons();
}

function syncOwnerFields() {
  document.getElementById("inpDevHp").value = stateData.hp;
  document.getElementById("inpDevMaxHp").value = stateData.maxHp;
  document.getElementById("inpDevPower").value = stateData.power;
  document.getElementById("inpDevExp").value = stateData.exp;
}
function applyOwnerPetStats() {
  stateData.maxHp = parseInt(document.getElementById("inpDevMaxHp").value) || 100;
  stateData.hp = parseInt(document.getElementById("inpDevHp").value) || 100;
  stateData.power = parseInt(document.getElementById("inpDevPower").value) || 65;
  stateData.exp = parseInt(document.getElementById("inpDevExp").value) || 0;
  stateData.activePetFile = document.getElementById("inpDevFileCode").value || "Ikan5";
  saveLocalData(); syncInterfaceGraphic(); pushUpdateToCloud(); alert("Core Modified!");
}
function generateOwnerLoot() {
  Object.keys(foodBag).forEach(key => { foodBag[key] = 50; });
  saveLocalData(); updateInventoryCounters(); alert("50x Loot Injected!");
}
function bypassCooldown() { stateData.deathTimestamp = null; stateData.hp = stateData.maxHp; saveLocalData(); syncInterfaceGraphic(); }

// ⚙ *CODESURGERY FIX*: Memaksa prioritas tinggi CSS menggunakan property !important saat trigger DOM via script
function openScreen(id) { document.getElementById(id).style.setProperty("display", "flex", "important"); }
function closeScreen(id) { document.getElementById(id).style.setProperty("display", "none", "important"); }

window.addEventListener("load", loadLocalData);
