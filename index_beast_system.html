<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLDS | Beast Engine Premium Core v2.2</title>
<style>
body {
  background: transparent; color: #fff;
  font-family: 'Courier New', Courier, monospace;
  margin: 0; padding: 0;
  overflow: hidden; box-sizing: border-box;
  user-select: none;
}
/* Main wrapper dibuat pas dengan ukuran iframe agar tidak bocor menghalangi footer parent */
.main-wrapper {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: #020205; border-radius: 8px;
  height: 520px; position: relative;
  overflow: hidden; box-sizing: border-box;
}

/* 🧭 NAVIGATION & HUD */
.top-nav-container {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: flex-start; z-index: 100;
  gap: 10px; pointer-events: none;
}
.nav-left { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.nav-btn {
  background: rgba(0,0,0,0.9); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 4px;
  font-family: inherit; text-transform: uppercase; transition: all 0.2s ease;
  white-space: nowrap; pointer-events: auto;
}
.nav-btn:hover:not(:disabled) { background: #fff; color: #000; transform: scale(1.03); }
.nav-btn:active:not(:disabled) { transform: scale(0.97); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.status-panel {
  background: rgba(0, 0, 0, 0.9); border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px 10px; border-radius: 6px; width: 145px; font-size: 10px; pointer-events: auto;
}
.bar-row { margin-bottom: 5px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
.bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

/* 🐉 PHYSICS SYSTEM STAGE (Z-Index diturunkan agar tidak menutupi tombol luar) */
.pet-center-stage {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
}
.pet-draggable-area {
  width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;
  cursor: grab; pointer-events: auto; 
  position: absolute; 
  left: calc(50% - 60px); top: calc(50% - 60px);
  touch-action: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.03);
}
.pet-draggable-area:active { cursor: grabbing; }
.pet-main-graphic {
  width: 90%; height: 90%; object-fit: contain;
  user-select: none; -webkit-user-drag: none;
}
.pet-floating-anim {
  animation: petIdleFloat 3s infinite ease-in-out;
}
@keyframes petIdleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.static-title-hud {
  position: absolute; top: 160px; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 4; pointer-events: none;
}
.pet-title-tag {
  font-size: 12px; font-weight: bold; letter-spacing: 1px; line-height: 1.4;
  text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 5px rgba(0,255,255,0.4); text-align: center;
}
.hunt-trigger-wrapper {
  position: absolute; bottom: 80px; left: 0; right: 0;
  display: flex; justify-content: center; z-index: 40;
}

/* 🎒 INVENTORY */
.bottom-controls {
  position: absolute; bottom: 12px; left: 12px; right: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 45;
}
.inventory-belt {
  display: flex; gap: 6px; background: rgba(0,0,0,0.9);
  padding: 6px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15);
}
.food-slot {
  width: 34px; height: 34px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  cursor: pointer; position: relative; transition: all 0.2s ease;
}
.food-slot:hover { transform: scale(1.1); border-color: #fff; }
.food-slot:active { transform: scale(0.9); }
.food-count {
  position: absolute; bottom: -2px; right: -2px; background: #fff; color: #000;
  font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 6px;
}

/* ⚔️ SCREEN OVERLAYS */
.screen-overlay {
  position: absolute; inset: 0; background: #020206; z-index: 200;
  display: none; flex-direction: column; padding: 15px; box-sizing: border-box;
  opacity: 0; transform: scale(0.98);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.screen-overlay.overlay-active {
  display: flex !important;
  opacity: 1;
  transform: scale(1);
}

.battle-arena-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 40px 0 10px 0; }
.fighter-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 6px; text-align: center; position: relative; }
.fighter-img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 4px; background: rgba(255,255,255,0.05); border-radius: 50%; }
.rarity-tag { font-size: 8px; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
.element-badge { position: absolute; top: 6px; right: 6px; font-size: 10px; }

.combat-log-screen { background: #000; border: 1px solid rgba(255,255,255,0.1); height: 95px; overflow-y: auto; padding: 8px; font-size: 10px; color: #00ff00; border-radius: 4px; margin-bottom: 8px; }
.rpg-action-board { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.skill-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px; font-family: inherit; font-size: 10px; cursor: pointer; border-radius: 4px; display: flex; flex-direction: column; transition: all 0.2s ease; }
.skill-btn:hover:not(:disabled) { background: #fff; color: #000; }
.skill-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.skill-meta { font-size: 8px; opacity: 0.6; margin-top: 2px; }

.battle-item-subpanel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(0,0,0,0.95); border: 1px solid rgba(255,255,255,0.2); padding: 8px; border-radius: 6px; margin-top: 6px; display: none; }
.cooldown-blocker { position: absolute; inset: 0; background: rgba(2,2,6,0.95); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

/* 📊 LEADERBOARD SYSTEM */
.leaderboard-header-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
.tab-btn { background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.15); font-size: 9px; padding: 6px 2px; cursor: pointer; text-align: center; font-family: inherit; border-radius: 4px; }
.tab-btn.active-tab { background: #fff; color: #000; font-weight: bold; }
.leaderboard-scroll-area { flex-grow: 1; overflow-y: auto; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px; }
.rank-row { display: grid; grid-template-columns: 30px 1fr 65px; padding: 6px 8px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; }
.rank-val { text-align: right; font-weight: bold; color: #00ffff; }

.gatekeeper-box { background: rgba(0,0,0,0.95); border: 1px solid #00ff00; padding: 15px; border-radius: 6px; text-align: center; width: 200px; margin: auto; margin-top: 100px; }
.dev-input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 6px; text-align: center; font-family: inherit; width: 90%; margin-bottom: 10px; border-radius: 4px; }
</style>

<script>
let audioCtx = null;
function triggerSfx(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    if (type === 'click') {
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
      gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'heavy') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    }
  } catch(e){}
}

const petNamingRegistry = {
  "Telor": { title: "Void Egg", element: "Water" }, "Ikan1": { title: "Glitter Fin", element: "Water" },
  "Ikan2": { title: "Aqua Brocade", element: "Water" }, "Ikan3": { title: "Torrent Glimmer", element: "Water" },
  "Ikan4": { title: "Abyssal Koi", element: "Water" }, "Ikan5": { title: "Aurelius Sovereign", element: "Water" },
  "Naga1": { title: "Pyre Hatchling", element: "Fire" }, "Naga2": { title: "Ember Scale", element: "Fire" },
  "Naga3": { title: "Blaze Wing", element: "Fire" }, "Naga4": { title: "Ignis Dread", element: "Fire" },
  "Naga5": { title: "Astral Sovereign", element: "Fire" }, "Serigala1": { title: "Lupin Pup", element: "Earth" },
  "Serigala2": { title: "Wild Fang", element: "Earth" }, "Serigala3": { title: "Alpha Claw", element: "Earth" },
  "Serigala4": { title: "Fenrir Shard", element: "Earth" }, "Serigala5": { title: "Apex Sovereign", element: "Earth" }
};

let stateData = {
  isHatched: true, activePetFile: "Ikan5", level: 10,                 
  hp: 100, maxHp: 100, hunger: 100, maxHunger: 100, exp: 0, maxExp: 400,
  power: 65, currentStreak: 0, highestStreak: 0, totalHunts: 0, 
  deathTimestamp: null, dominionName: "Player", codeParent: ""
};

let foodBag = { apple: 5, candy: 5, juice: 4, bread: 2, burger: 1, pizza: 1, elixir: 2, pill: 3, revive: 1 };
const foodValues = {
  apple: { xp: 10, hp: 15, hunger: 20 }, candy: { xp: 15, hp: 10, hunger: 15 },
  juice: { xp: 20, hp: 20, hunger: 25 }, bread: { xp: 25, hp: 30, hunger: 35 },
  burger: { xp: 40, hp: 45, hunger: 50 }, pizza: { xp: 60, hp: 60, hunger: 65 }
};

const enemyPool = [
  { name: "Lupin Pup Wild", multiplier: 1.0, img: "Serigala1.png", element: "Earth", rarity: "Common" },
  { name: "Glitter Fin Rogue", multiplier: 1.1, img: "Ikan1.png", element: "Water", rarity: "Common" },
  { name: "Aqua Brocade Mutant", multiplier: 1.4, img: "Ikan2.png", element: "Water", rarity: "Rare" },
  { name: "Ember Scale Drake", multiplier: 3.5, img: "Naga2.png", element: "Fire", rarity: "Mythic" }
];

const elementIcons = { Fire: "🔥", Water: "💧", Earth: "🌿" };
let currentActiveTab = 'streak';
const FIREBASE_DB_URL = "https://bolds-beast-engine-default-rtdb.asia-southeast1.firebasedatabase.app";

/* 📡 INTEGRASI TOTAL: Menangkap Otomatis Code & ID dari Web Parent */
window.addEventListener("message", (e) => {
  if (e.data) {
    // Menangkap data telemetri bawaan system lu
    if (e.data.type === 'TELEMETRY_UPDATE') {
      if (e.data.data && e.data.data.dominionName) {
        stateData.dominionName = e.data.data.dominionName;
        stateData.currentStreak = e.data.data.count || 0;
        stateData.highestStreak = e.data.data.highestCount || 0;
      }
      if (e.data.pet && e.data.pet.name) {
        stateData.activePetFile = e.data.pet.name;
      }
    }
    // Menangkap ekstraksi manual jika parent melempar objek text "Code" / "ID"
    if (e.data.code || e.data.id || e.data.username) {
      stateData.dominionName = e.data.username || e.data.id || stateData.dominionName;
      stateData.codeParent = e.data.code || "";
    }
    saveLocalData();
    syncInterfaceGraphic();
  }
});

function saveLocalData() {
  try {
    localStorage.setItem("BLDS_GATE_STATE_V2", JSON.stringify(stateData));
    localStorage.setItem("BLDS_GATE_BAG_V2", JSON.stringify(foodBag));
  } catch(e) {}
}

function loadLocalData() {
  try {
    const s = localStorage.getItem("BLDS_GATE_STATE_V2");
    if(s) stateData = JSON.parse(s);
    const b = localStorage.getItem("BLDS_GATE_BAG_V2"); 
    if(b) foodBag = JSON.parse(b);
  } catch(e){}

  // Request handshake ke web utama lu biar portal datanya langsung terbuka
  if(window.parent) {
    window.parent.postMessage({ type: 'BEAST_HANDSHAKE_REQ' }, '*');
    window.parent.postMessage({ type: 'REQUEST_USER_INFO' }, '*');
  }

  checkDeathCooldown();
  syncInterfaceGraphic();
  initPhysicsEngine(); 
  setInterval(checkDeathCooldown, 1000);
}

function verifyGatekeeperKey() {
  const field = document.getElementById("gatekeeperKeyField");
  if(field.value === "OWNERONLYBLDS") {
    field.value = ""; closeScreen('gatekeeperScreen'); openScreen('ownerScreen'); syncOwnerFields();
  } else {
    alert("INVALID KEY!"); field.value = "";
  }
}

function openLeaderboardScreen() { openScreen('leaderboardScreen'); switchLeaderboardTab(currentActiveTab); }
function switchLeaderboardTab(tab) {
  currentActiveTab = tab;
  document.getElementById("lblTabStreak").classList.remove("active-tab");
  document.getElementById("lblTabHunt").classList.remove("active-tab");
  document.getElementById("lblTabLevel").classList.remove("active-tab");
  document.getElementById(`lblTab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add("active-tab");
  renderLeaderboardRows();
}

function renderLeaderboardRows() {
  const box = document.getElementById("leaderboardRowsContainer");
  box.innerHTML = `<div style="text-align:center; padding:15px; font-size:10px; opacity:0.5;">Loading live matrix...</div>`;
  fetch(`${FIREBASE_DB_URL}/leaderboard.json`)
    .then(res => res.json())
    .then(cloudData => {
      let dataset = [];
      if (cloudData) {
        Object.keys(cloudData).forEach(key => {
          if (cloudData[key] && cloudData[key].displayName) {
            dataset.push({ name: cloudData[key].displayName, streak: cloudData[key].streak || 0, hunt: cloudData[key].hunt || 0, level: cloudData[key].level || 1 });
          }
        });
      }
      if (!dataset.some(u => u.name === stateData.dominionName)) {
        dataset.push({ name: stateData.dominionName, streak: stateData.highestStreak, hunt: stateData.totalHunts, level: stateData.level });
      }
      if(currentActiveTab === 'streak') dataset.sort((a,b) => b.streak - a.streak);
      if(currentActiveTab === 'hunt') dataset.sort((a,b) => b.hunt - a.hunt);
      if(currentActiveTab === 'level') dataset.sort((a,b) => b.level - a.level);

      box.innerHTML = "";
      dataset.slice(0, 15).forEach((user, index) => {
        let valText = currentActiveTab === 'streak' ? `${user.streak} Strk` : currentActiveTab === 'hunt' ? `${user.hunt} Hnt` : `Lvl ${user.level}`;
        let rowStyle = (user.name === stateData.dominionName) ? "background:rgba(0,255,255,0.12); border:1px solid #00ffff;" : "";
        box.innerHTML += `<div class="rank-row" style="${rowStyle}"><div class="rank-num">#${index+1}</div><div class="rank-name">${user.name}</div><div class="rank-val">${valText}</div></div>`;
      });
    }).catch(() => { box.innerHTML = `<div style="text-align:center; padding:15px; font-size:10px; color:#ff4a4a;">Offline Mode.</div>`; });
}

function syncInterfaceGraphic() {
  const lookup = petNamingRegistry[stateData.activePetFile] || { title: "Aurelius Sovereign", element: "Water" };
  document.getElementById("petGraphicFile").src = stateData.activePetFile + ".png";
  document.getElementById("petLabelTag").innerHTML = `${elementIcons[lookup.element]} ${lookup.title} [Lvl ${stateData.level}]<br><span style="font-size:9px;color:#00ffff;">ID: ${stateData.dominionName}</span>`;
  document.getElementById("death-revive-stock").innerText = foodBag.revive || 0;
  renderStats(); updateInventoryCounters();
}

function renderStats() {
  document.getElementById("txtHp").innerText = `${stateData.hp}/${stateData.maxHp}`;
  document.getElementById("fillHp").style.width = `${(stateData.hp / stateData.maxHp) * 100}%`;
  document.getElementById("txtHunger").innerText = `${stateData.hunger}/${stateData.maxHunger}`;
  document.getElementById("fillHunger").style.width = `${(stateData.hunger / stateData.maxHunger) * 100}%`;
  document.getElementById("txtExp").innerText = `${Math.floor((stateData.exp / stateData.maxExp) * 100)}%`;
  document.getElementById("fillExp").style.width = `${(stateData.exp / stateData.maxExp) * 100}%`;
}

function updateInventoryCounters() {
  Object.keys(foodBag).forEach(key => { const el = document.getElementById(`count-${key}`); if(el) el.innerText = foodBag[key]; });
}

function feedPet(item) {
  if (foodBag[item] <= 0 || stateData.hp <= 0) return;
  foodBag[item]--;
  const val = foodValues[item];
  stateData.hunger = Math.min(stateData.maxHunger, stateData.hunger + val.hunger);
  stateData.hp = Math.min(stateData.maxHp, stateData.hp + val.hp);
  stateData.exp += val.xp;
  if (stateData.exp >= stateData.maxExp) {
    stateData.exp = 0; stateData.level++; stateData.power += 6; stateData.maxHp += 15; stateData.hp = stateData.maxHp;
    pushUpdateToCloud();
  }
  saveLocalData(); syncInterfaceGraphic(); vy = -10;
}

function useFullElixir() { if(foodBag.elixir > 0) { foodBag.elixir--; stateData.hp = stateData.maxHp; stateData.hunger = stateData.maxHunger; saveLocalData(); syncInterfaceGraphic(); } }

/* 🕹️ LIGHTWEIGHT ENGINE PHYSICS */
let pet = null, wrapper = null, isDragging = false;
let px = 0, py = 0, vx = 0, vy = 0, lastMouseX = 0, lastMouseY = 0, dragOffsetX = 0, dragOffsetY = 0;

function initPhysicsEngine() {
  pet = document.getElementById("petActor"); wrapper = document.getElementById("windowBox");
  px = (wrapper.clientWidth / 2) - 60; py = (wrapper.clientHeight / 2) - 40;
  pet.addEventListener("mousedown", startDrag); window.addEventListener("mousemove", doDrag); window.addEventListener("mouseup", stopDrag);
  pet.addEventListener("touchstart", startDrag, {passive: false}); window.addEventListener("touchmove", doDrag, {passive: false}); window.addEventListener("touchend", stopDrag);
  requestAnimationFrame(physicsTick);
}
function startDrag(e) {
  isDragging = true; pet.classList.remove("pet-floating-anim");
  let pageX = e.pageX || e.touches[0].pageX, pageY = e.pageY || e.touches[0].pageY;
  let rect = pet.getBoundingClientRect();
  dragOffsetX = pageX - (rect.left + window.scrollX); dragOffsetY = pageY - (rect.top + window.scrollY);
  lastMouseX = pageX; lastMouseY = pageY; vx = 0; vy = 0;
}
function doDrag(e) {
  if (!isDragging) return;
  let pageX = e.pageX || e.touches[0].pageX, pageY = e.pageY || e.touches[0].pageY;
  let wrapperRect = wrapper.getBoundingClientRect();
  px = pageX - wrapperRect.left - dragOffsetX; py = pageY - wrapperRect.top - dragOffsetY;
  vx = pageX - lastMouseX; vy = pageY - lastMouseY;
  lastMouseX = pageX; lastMouseY = pageY;
}
function stopDrag() { isDragging = false; }
function physicsTick() {
  if (!isDragging) {
    let centerX = (wrapper.clientWidth / 2) - 60, centerY = (wrapper.clientHeight / 2) - 40;
    vx *= 0.95; vy *= 0.95; px += vx; py += vy;
    if (Math.abs(vx) < 1 && Math.abs(vy) < 1) { px += (centerX - px) * 0.04; py += (centerY - py) * 0.04; if(!pet.classList.contains("pet-floating-anim")) pet.classList.add("pet-floating-anim"); }
    if (px < 0 || px > wrapper.clientWidth - 120) vx *= -0.7;
    if (py < 0 || py > wrapper.clientHeight - 120) vy *= -0.7;
    pet.style.left = px + "px"; pet.style.top = py + "px";
    pet.style.transform = `rotate(${vx * 1.5}deg)`;
  } else {
    pet.style.left = px + "px"; pet.style.top = py + "px";
  }
  requestAnimationFrame(physicsTick);
}

/* ⚔️ RPG ENGINE TURN CONTROL */
let activeEnemy = null, playerBattleHp = 0, enemyBattleHp = 0, skillCooldowns = [0,0,0,0], isEnemyStunned = false, doubleDamageActive = false, isCombatTurnResolving = false;

function prepareBattle() {
  isCombatTurnResolving = false; activeEnemy = enemyPool[Math.floor(Math.random() * enemyPool.length)];
  let lvlMod = Math.floor(stateData.level * (0.8 + Math.random() * 0.4)) || 1;
  activeEnemy.maxHp = Math.floor((55 + (lvlMod * 9)) * activeEnemy.multiplier); activeEnemy.hp = activeEnemy.maxHp;
  activeEnemy.dmg = Math.floor((7 + (lvlMod * 2)) * activeEnemy.multiplier);
  playerBattleHp = stateData.hp; enemyBattleHp = activeEnemy.hp; skillCooldowns = [0,0,0,0]; isEnemyStunned = false; doubleDamageActive = false;
  
  document.getElementById("btPlayerImg").src = stateData.activePetFile + ".png";
  document.getElementById("btEnemyImg").src = activeEnemy.img;
  document.getElementById("btEnemyName").innerText = activeEnemy.name;
  document.getElementById("battleLogBox").innerHTML = `<div>Battle Core terhubung. Pilih Protocol!</div>`;
  updateRpgActionButtons();
}

function updateRpgActionButtons() {
  document.getElementById("btPlayerHp").innerText = `${playerBattleHp}/${stateData.maxHp} HP`;
  document.getElementById("btEnemyHp").innerText = `${enemyBattleHp}/${activeEnemy.maxHp} HP`;
  for(let i=0; i<4; i++) document.getElementById(`skillBtn${i}`).disabled = (skillCooldowns[i] > 0 || isCombatTurnResolving);
  document.getElementById("b-stock-elixir").innerText = foodBag.elixir;
  document.getElementById("b-stock-pill").innerText = foodBag.pill;
}

function executeRpgTurn(idx) {
  if (isCombatTurnResolving) return; isCombatTurnResolving = true;
  let mult = [1.0, 1.5, 0.6, 2.5][idx]; if(idx===1) skillCooldowns[1]=3; if(idx===3) skillCooldowns[3]=5;
  let dmg = Math.floor(stateData.power * mult); if(doubleDamageActive) { dmg *= 2; doubleDamageActive = false; }
  
  enemyBattleHp = Math.max(0, enemyBattleHp - dmg);
  document.getElementById("battleLogBox").innerHTML += `<div>💥 Pet menyerang! -${dmg} HP Musuh.</div>`;
  
  if(idx===2 && Math.random() < 0.5) { isEnemyStunned = true; document.getElementById("battleLogBox").innerHTML += `<div style="color:#00ffff;">↳ Stun Berhasil!</div>`; }
  for(let i=0; i<4; i++) if(i!==idx && skillCooldowns[i]>0) skillCooldowns[i]--;

  if(enemyBattleHp <= 0) { handleBattleVictory(); return; }
  
  setTimeout(() => {
    if(isEnemyStunned) { isEnemyStunned = false; isCombatTurnResolving = false; updateRpgActionButtons(); return; }
    playerBattleHp = Math.max(0, playerBattleHp - activeEnemy.dmg);
    document.getElementById("battleLogBox").innerHTML += `<div style="color:#ff4a4a;">💥 Musuh membalas! -${activeEnemy.dmg} HP.</div>`;
    if(playerBattleHp <= 0) handleBattleDefeat(); else { isCombatTurnResolving = false; updateRpgActionButtons(); }
  }, 800);
}

function handleBattleVictory() {
  stateData.currentStreak++; stateData.totalHunts++; if(stateData.currentStreak > stateData.highestStreak) stateData.highestStreak = stateData.currentStreak;
  stateData.exp += Math.floor(stateData.maxExp * 0.35);
  if(stateData.exp >= stateData.maxExp) { stateData.exp=0; stateData.level++; stateData.maxHp+=15; stateData.power+=6; }
  stateData.hp = playerBattleHp; saveLocalData(); syncInterfaceGraphic(); pushUpdateToCloud();
  document.getElementById("battleLogBox").innerHTML += `<div style="color:#00ff00;">Victory! Menang Streak.</div>`;
  setTimeout(() => closeScreen('battleScreen'), 1000);
}

function handleBattleDefeat() {
  stateData.currentStreak = 0; stateData.hp = 0; stateData.deathTimestamp = Date.now() + (5 * 60 * 60 * 1000);
  saveLocalData(); syncInterfaceGraphic(); pushUpdateToCloud();
  setTimeout(() => { closeScreen('battleScreen'); checkDeathCooldown(); }, 800);
}

function pushUpdateToCloud() {
  if (!stateData.dominionName || stateData.dominionName === "Player") return;
  const key = stateData.dominionName.replace(/[.#$\[\]]/g, "_");
  fetch(`${FIREBASE_DB_URL}/leaderboard/${key}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ displayName: stateData.dominionName, streak: stateData.highestStreak, hunt: stateData.totalHunts, level: stateData.level }) }).catch(()=>{});
}

function checkDeathCooldown() {
  if (stateData.deathTimestamp && Date.now() < stateData.deathTimestamp) {
    document.getElementById("deathOverlay").style.display = "flex";
    let diff = stateData.deathTimestamp - Date.now();
    let mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)), secs = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById("countdownTimer").innerText = `00:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  } else { document.getElementById("deathOverlay").style.display = "none"; }
}

function useReviveInstant() { if(foodBag.revive > 0) { foodBag.revive--; stateData.deathTimestamp = null; stateData.hp = Math.floor(stateData.maxHp * 0.5); saveLocalData(); syncInterfaceGraphic(); } }
function bypassCooldown() { stateData.deathTimestamp = null; stateData.hp = stateData.maxHp; saveLocalData(); syncInterfaceGraphic(); }
function toggleBattleItemPanel() { const p = document.getElementById("battleItemPanel"); p.style.display = p.style.display === "grid" ? "none" : "grid"; }
function useBattleItem(type) {
  if(type==='elixir' && foodBag.elixir>0) { foodBag.elixir--; playerBattleHp = stateData.maxHp; }
  if(type==='pill' && foodBag.pill>0) { foodBag.pill--; doubleDamageActive = true; }
  toggleBattleItemPanel(); updateRpgActionButtons();
}

function syncOwnerFields() {
  document.getElementById("inpDevHp").value = stateData.hp; document.getElementById("inpDevMaxHp").value = stateData.maxHp;
  document.getElementById("inpDevPower").value = stateData.power; document.getElementById("inpDevExp").value = stateData.exp;
}
function applyOwnerPetStats() {
  stateData.maxHp = parseInt(document.getElementById("inpDevMaxHp").value) || 100; stateData.hp = parseInt(document.getElementById("inpDevHp").value) || 100;
  stateData.power = parseInt(document.getElementById("inpDevPower").value) || 65; stateData.exp = parseInt(document.getElementById("inpDevExp").value) || 0;
  stateData.activePetFile = document.getElementById("inpDevFileCode").value || "Ikan5";
  saveLocalData(); syncInterfaceGraphic(); alert("Core Modified!");
}
function generateOwnerLoot() { Object.keys(foodBag).forEach(k => foodBag[k] = 50); saveLocalData(); updateInventoryCounters(); alert("Items Injected!"); }

/* 🧭 SCREEN TRANSITIONS */
function openScreen(id) { const el = document.getElementById(id); el.style.display = "flex"; requestAnimationFrame(() => el.classList.add("overlay-active")); }
function closeScreen(id) { const el = document.getElementById(id); el.classList.remove("overlay-active"); setTimeout(() => { if(!el.classList.contains("overlay-active")) el.style.display = "none"; }, 210); }

window.addEventListener("load", loadLocalData);
</script>
