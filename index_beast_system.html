<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color-scale=1.0, user-scalable=no" />
  <title>Beast Engine v3 - Complete RPG System</title>
  <style>
    :root {
      --bg-main: #000000;
      --panel-bg: #070708;
      --border-color: #1f2026;
      --accent-green: #00ffcc;
      --accent-red: #ff4a4a;
      --accent-orange: #ffcc00;
      --accent-purple: #bf5af2;
    }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--bg-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff; overflow-x: hidden; user-select: none; -webkit-user-select: none;
    }

    #app-container {
      display: flex; flex-direction: column; min-height: 100vh; padding: 15px; box-sizing: border-box;
    }

    /* --- TOP MENU BAR --- */
    .top-menu {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;
    }
    .menu-btn {
      background: transparent; border: 1px solid #2d3039; color: #fff;
      padding: 10px; border-radius: 20px; font-size: 13px; cursor: pointer; text-align: center;
    }
    .menu-btn:active { background: #111215; }

    /* --- VIEW SCREENS --- */
    .screen { display: none; width: 100%; }
    .screen.active { display: block; }

    /* --- MAIN DASHBOARD VIEW --- */
    .main-panel {
      border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; background: var(--panel-bg);
      position: relative; display: flex; flex-direction: column; align-items: center; min-height: 480px;
    }
    .panel-header { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; }
    
    .stats-box { width: 60%; background: #111215; padding: 10px; border-radius: 8px; border: 1px solid #1f2026; }
    .stat-bar-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; font-size: 11px; }
    .bar-bg { width: 70px; height: 8px; background: #22242b; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.3s; }

    /* Draggable Pet Area */
    .pet-environment {
      flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; 
      align-items: center; position: relative; min-height: 220px; overflow: hidden;
    }
    .pet-box {
      position: absolute; display: flex; flex-direction: column; align-items: center; cursor: grab;
      transition: transform 0.1s ease; touch-action: none;
    }
    .pet-box:active { cursor: grabbing; }
    
    /* Style pendukung gambar Leonardo AI */
    .pet-avatar-render { 
      width: 90px; height: 90px; object-fit: contain; pointer-events: none; user-select: none;
    }
    .pet-label { font-size: 13px; margin-top: 5px; font-family: monospace; color: #8b949e; }

    /* Tombol Hunt Wild di bawah pet */
    .hunt-trigger-zone { width: 100%; display: flex; justify-content: center; margin: 15px 0; }
    .btn-hunt-wild {
      width: 85%; border: 1px solid var(--accent-red); background: rgba(255, 74, 74, 0.1);
      color: var(--accent-red); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
    }
    .btn-hunt-wild:active { background: rgba(255, 74, 74, 0.25); }

    /* Footer Items */
    .items-footer { width: 100%; text-align: center; margin-top: auto; }
    .footer-title { font-size: 11px; color: #8b949e; margin-bottom: 8px; font-family: monospace; }
    .items-row { display: flex; justify-content: center; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .item-circle {
      width: 45px; height: 45px; background: #111215; border: 1px solid #1f2026; border-radius: 50%;
      display: flex; justify-content: center; align-items: center; font-size: 20px; position: relative; cursor: pointer;
    }
    .item-count {
      position: absolute; bottom: -2px; right: -2px; background: #00ffcc; color: #000;
      font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 10px;
    }

    /* --- COMBAT FIELD VIEW --- */
    .combat-arena { border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; background: var(--panel-bg); }
    .combat-header { display: flex; justify-content: space-between; color: #ff4a4a; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
    .combat-vs-display { display: flex; justify-content: space-around; align-items: center; margin-bottom: 15px; }
    .fighter-card { background: #111215; border: 1px solid #1f2026; border-radius: 8px; padding: 10px; width: 45%; text-align: center; }
    .fighter-avatar-wrapper { width: 65px; height: 65px; margin: 0 auto 5px auto; display: flex; justify-content: center; align-items: center; }
    .fighter-avatar-wrapper img { width: 100%; height: 100%; object-fit: contain; }
    .fighter-name { font-size: 12px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .combat-logs {
      background: #090000; border: 1px solid #ff4a4a; border-radius: 6px; height: 120px;
      overflow-y: auto; padding: 8px; font-family: monospace; font-size: 11px; margin-bottom: 15px; text-align: left;
    }
    .combat-actions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .skill-btn {
      background: #1f2026; border: 1px solid #2d3039; color: #fff; padding: 10px 5px;
      border-radius: 6px; font-size: 12px; cursor: pointer; text-align: center; display: flex; flex-direction: column; gap: 2px;
    }
    .skill-btn .dmg-hint { font-size: 9px; color: #8b949e; }
    .skill-btn:active { background: #2d3039; }
    .btn-item-action { background: #0c2b26; border-color: var(--accent-green); color: var(--accent-green); }
    .btn-flee-action { background: #2b1111; border-color: var(--accent-red); color: var(--accent-red); }

    /* --- BESTIARY & SWITCH VIEW --- */
    .bestiary-container { border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; background: var(--panel-bg); }
    .pet-list { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; }
    .pet-list-item {
      display: flex; align-items: center; justify-content: space-between; background: #111215;
      border: 1px solid #1f2026; border-radius: 8px; padding: 10px; cursor: pointer;
    }
    .pet-list-item.active-pet { border-color: var(--accent-green); background: #0c2b26; }
    .pet-list-item.silhouette { filter: brightness(0); opacity: 0.3; }
    .item-left-info { display: flex; align-items: center; gap: 10px; }
    .list-avatar-box { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; }
    .list-avatar-box img { width: 100%; height: 100%; object-fit: contain; }
    .list-details h4 { margin: 0; font-size: 13px; }
    .list-details p { margin: 3px 0 0 0; font-size: 10px; color: #8b949e; }
    
    /* --- INVENTORY MODAL --- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box {
      background: #0c0d12; border: 1px solid var(--border-color); border-radius: 12px;
      padding: 20px; width: 100%; max-width: 320px; text-align: center;
    }
    .modal-grid { display: flex; justify-content: space-around; margin: 20px 0; }
    .close-modal {
      background: #1f2026; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <div class="top-menu">
      <button class="menu-btn" id="btn-switch-screen" onclick="openBestiary()">📖 BESTIARY & SWITCH</button>
      <button class="menu-btn" style="display:none;" id="btn-back-dash" onclick="showScreen('dash-screen')">🔙 KEMBALI KE MENU UTAMA</button>
    </div>

    <div id="dash-screen" class="screen active">
      <div class="main-panel">
        <div class="panel-header">
          <div class="menu-btn" style="padding: 5px 10px; font-size: 11px;">Beast Engine</div>
          
          <div class="stats-box">
            <div class="stat-bar-container">
              <span>HP</span><span id="dash-hp-text">100/100</span>
              <div class="bar-bg"><div id="dash-hp-bar" class="bar-fill" style="background:var(--accent-red);"></div></div>
            </div>
            <div class="stat-bar-container">
              <span>HNG</span><span id="dash-hng-text">100/100</span>
              <div class="bar-bg"><div id="dash-hng-bar" class="bar-fill" style="background:var(--accent-orange);"></div></div>
            </div>
            <div class="stat-bar-container">
              <span>EXP</span><span id="dash-exp-text">0%</span>
              <div class="bar-bg"><div id="dash-exp-bar" class="bar-fill" style="background:var(--accent-green);"></div></div>
            </div>
          </div>
        </div>

        <div class="pet-environment" id="drag-zone">
          <div class="pet-box" id="pet-draggable">
            <div id="dash-avatar-container"></div>
            <div class="pet-label" id="dash-name-label">Loading...</div>
          </div>
        </div>

        <div class="hunt-trigger-zone">
          <button class="btn-hunt-wild" onclick="triggerHuntWild()">⚔️ HUNT WILD</button>
        </div>

        <div class="items-footer">
          <div class="footer-title">Feed Pet Items</div>
          <div class="items-row">
            <div class="item-circle" onclick="feedPet('🍎')">🍎<span class="item-count">3</span></div>
            <div class="item-circle" onclick="feedPet('🍬')">🍬<span class="item-count">2</span></div>
            <div class="item-circle" onclick="feedPet('🧃')">🧃<span class="item-count">3</span></div>
            <div class="item-circle" onclick="feedPet('🍞')">🍞<span class="item-count">1</span></div>
            <div class="item-circle" onclick="openBagFromDash()">🧪<span class="item-count" id="dash-potion-count">0</span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="combat-screen" class="screen">
      <div class="combat-arena">
        <div class="combat-header">
          <span>⚔️ WILD HUNTING DOMAIN</span>
          <span id="enemy-rarity" style="font-size:11px; letter-spacing:1px;">RARITY</span>
        </div>

        <div class="combat-vs-display">
          <div class="fighter-card">
            <div class="fighter-avatar-wrapper" id="battle-my-avatar-container"></div>
            <div class="fighter-name" id="battle-my-name">Pet Player</div>
            <div class="stat-bar-container" style="justify-content:center; gap:5px;">
              <div class="bar-bg" style="width:100%"><div id="battle-my-hpbar" class="bar-fill" style="background:var(--accent-red);"></div></div>
            </div>
            <div id="battle-my-hptext" style="font-size:10px; font-family:monospace;">100/100 HP</div>
          </div>

          <div style="font-size: 18px; font-weight: bold; color: #555;">VS</div>

          <div class="fighter-card" style="border-color: #ff4a4a;">
            <div class="fighter-avatar-wrapper" id="battle-enemy-avatar-container"></div>
            <div class="fighter-name" id="battle-enemy-name">Wild Enemy</div>
            <div class="stat-bar-container" style="justify-content:center; gap:5px;">
              <div class="bar-bg" style="width:100%"><div id="battle-enemy-hpbar" class="bar-fill" style="background:var(--accent-red);"></div></div>
            </div>
            <div id="battle-enemy-hptext" style="font-size:10px; font-family:monospace;">100/100 HP</div>
          </div>
        </div>

        <div class="combat-logs" id="combat-log-box"></div>

        <div class="combat-actions-grid">
          <button class="skill-btn" onclick="executeSkill(1)">
            <span id="skill1-name">Skill 1</span><span class="dmg-hint" id="skill1-dmg">Dmg: 0</span>
          </button>
          <button class="skill-btn" onclick="executeSkill(2)">
            <span id="skill2-name">Skill 2</span><span class="dmg-hint" id="skill2-dmg">Dmg: 0</span>
          </button>
          <button class="skill-btn" onclick="executeSkill(3)">
            <span id="skill3-name">Skill 3</span><span class="dmg-hint" id="skill3-dmg">Dmg: 0 (Stun 25%)</span>
          </button>
          <button class="skill-btn btn-item-action" onclick="openBattleInventory()">
            <span>🎒 PAKE ITEM</span><span class="dmg-hint" style="color:var(--accent-green);">Buka Tas</span>
          </button>
          <button class="skill-btn btn-flee-action" style="grid-column: span 2;" onclick="attemptFlee()">
            <span>🏃 KABUR (FLEE)</span><span class="dmg-hint" style="color:var(--accent-red);">Kembali ke menu</span>
          </button>
        </div>
      </div>
    </div>

    <div id="bestiary-screen" class="screen">
      <div class="bestiary-container">
        <h3 style="margin-top:0; border-bottom:1px solid #1f2026; padding-bottom:8px;">👾 Discovery Bestiary</h3>
        <div class="pet-list" id="bestiary-list-wrapper"></div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="inventory-modal">
    <div class="modal-box">
      <h3 style="margin-top:0; border-bottom:1px solid #1f2026; padding-bottom:8px;">🎒 Tas Penyimpanan</h3>
      <div class="modal-grid">
        <div class="item-circle" onclick="useItemInBattle('🧪')">🧪<span class="item-count" id="modal-qty-potion">0</span></div>
        <div class="item-circle" onclick="useItemInBattle('💊')">💊<span class="item-count" id="modal-qty-pill">0</span></div>
      </div>
      <p style="font-size:11px; color:#8b949e; margin-bottom:15px;">🧪 Pulihkan 100% HP | 💊 Buff Damage 2x Lipat (1 Turn)</p>
      <button class="close-modal" onclick="closeInventoryModal()">TUTUP</button>
    </div>
  </div>

  <script>
    // ========================================================
    // DATABASE PET UTAMA (SILAHKAN GANTI PATH FILE .PNG LU DI SINI)
    // ========================================================
    const EVOLUTION_DATABASE = {
      // 1. STARTER: NAGA (ELEMENT: COSMIC / FIRE)
      naga: {
        type: "epic-evo",
        phases: [
          { name: "Nebula Core Egg", avatar: '<img src="naga1.png" class="pet-avatar-render">', hp: 80, power: 18 },
          { name: "Starfire Wyrm", avatar: '<img src="naga2.png" class="pet-avatar-render">', hp: 160, power: 38 },
          { name: "Volcanic Drake", avatar: '<img src="naga3.png" class="pet-avatar-render">', hp: 350, power: 80 },
          { name: "Cosmic Wyvern", avatar: '<img src="naga4.png" class="pet-avatar-render">', hp: 700, power: 160 },
          { name: "Aethelgard Nova Star", avatar: '<img src="naga5.png" class="pet-avatar-render">', hp: 1500, power: 350 }
        ],
        skills: ["Cosmic Ember", "Starfire Tail Whip", "Singularity Collapse"]
      },
      // 2. STARTER: IKAN (ELEMENT: WATER)
      ikan: {
        type: "epic-evo",
        phases: [
          { name: "Aqua Pearl Egg", avatar: '<img src="ikan1.png" class="pet-avatar-render">', hp: 50, power: 10 },
          { name: "Neon Fry", avatar: '<img src="ikan2.png" class="pet-avatar-render">', hp: 100, power: 20 },
          { name: "Abyssal Pike", avatar: '<img src="ikan3.png" class="pet-avatar-render">', hp: 220, power: 48 },
          { name: "Fin Sovereign", avatar: '<img src="ikan4.png" class="pet-avatar-render">', hp: 460, power: 95 },
          { name: "Moridun Ocean Overlord", avatar: '<img src="ikan5.png" class="pet-avatar-render">', hp: 1000, power: 220 }
        ],
        skills: ["Water Pulse", "Aqua Fin Cutter", "Tidal Wave Crash"]
      },
      // 3. STARTER: SERIGALA (ELEMENT: LIGHTNING / GUNTUR)
      serigala: {
        type: "epic-evo",
        phases: [
          { name: "Static Pup", avatar: '<img src="serigala1.png" class="pet-avatar-render">', hp: 60, power: 12 },
          { name: "Spark Lupo", avatar: '<img src="serigala2.png" class="pet-avatar-render">', hp: 120, power: 25 },
          { name: "Fulgur Hunter", avatar: '<img src="serigala3.png" class="pet-avatar-render">', hp: 250, power: 55 },
          { name: "Thunder Warg", avatar: '<img src="serigala4.png" class="pet-avatar-render">', hp: 500, power: 110 },
          { name: "Volkrieg Cyber-Storm", avatar: '<img src="serigala5.png" class="pet-avatar-render">', hp: 1100, power: 240 }
        ],
        skills: ["Volt Bite", "Thunder Howl", "Fulgur Blitz Strike"]
      },

      // ================= HADIAH STREAK 100 (MYTHIC INSTAN) =================
      ammit: {
        type: "mythic-instan",
        name: "Ammit Void-Guardian",
        avatar: '<img src="ammit.png" class="pet-avatar-render">',
        hp: 1800,
        power: 380,
        skills: ["Void Chomp", "Dark Matter Pulse", "Soul Devourer"]
      },
      sleipnir: {
        type: "mythic-instan",
        name: "Sleipnir Gravity-Drive",
        avatar: '<img src="sleipnir.png" class="pet-avatar-render">',
        hp: 1600,
        power: 420,
        skills: ["Quantum Stampede", "Aegis Overdrive", "Gravity Collapse"]
      },
      yatagarasu: {
        type: "mythic-instan",
        name: "Yatagarasu Eclipse-Lord",
        avatar: '<img src="yatagarasu.png" class="pet-avatar-render">',
        hp: 1400,
        power: 450,
        skills: ["Solar Eclipse", "Calamity Feather", "Shadow Fire Flare"]
      }
    };

    // SYSTEM PLAYER DATA STATE
    let userInventory = { potion: 3, pill: 2 };
    let activePetKey = "naga";
    
    // Sistem Discovery Tracker (Pet yang belum dapet streak 100 jadi siluet hitam dulu)
    let discoveredPets = ["naga", "serigala", "ikan"]; 

    let playerBeasts = {
      naga: { level: 1, exp: 40, currentHp: 80, phaseIndex: 0 }, 
      serigala: { level: 1, exp: 0, currentHp: 60, phaseIndex: 0 },
      ikan: { level: 1, exp: 0, currentHp: 50, phaseIndex: 0 },
      ammit: { level: 10, exp: 0, currentHp: 1800, phaseIndex: 0 },
      sleipnir: { level: 10, exp: 0, currentHp: 1600, phaseIndex: 0 },
      yatagarasu: { level: 10, exp: 0, currentHp: 1400, phaseIndex: 0 }
    };

    let combatState = null;

    // RUNTIME INITIALIZATION
    document.addEventListener("DOMContentLoaded", function() {
      initDraggablePet();
      syncDashboardUI();
      
      // Simulasi Unlocked otomatis pet streak 100 untuk bahan testing kamu (Bisa dihapus nanti)
      setTimeout(() => {
        alert("🔥 BONUS STREAK 100 HARI BERHASIL DICAPAI! 3 Pet Mythic (Ammit, Sleipnir, Yatagarasu) telah ditambahkan ke Bestiary!");
        discoveredPets.push("ammit", "sleipnir", "yatagarasu");
      }, 1500);
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).add('active');
      document.getElementById(screenId).classList.add('active');
      
      if(screenId === 'dash-screen') {
        document.getElementById('btn-back-dash').style.display = 'none';
        document.getElementById('btn-switch-screen').style.display = 'block';
        syncDashboardUI();
      } else {
        document.getElementById('btn-back-dash').style.display = 'block';
        document.getElementById('btn-switch-screen').style.display = 'none';
      }
    }

    // INTERAKSI DRAGGABLE PET (Elastic central bouncing return)
    function initDraggablePet() {
      const pet = document.getElementById('pet-draggable');
      const zone = document.getElementById('drag-zone');
      let isDragging = false;
      let startX, startY, currentX = 0, currentY = 0;

      pet.addEventListener('mousedown', dragStart);
      pet.addEventListener('touchstart', dragStart, { passive: true });
      window.addEventListener('mousemove', dragMove);
      window.addEventListener('touchmove', dragMove, { passive: false });
      window.addEventListener('mouseup', dragEnd);
      window.addEventListener('touchend', dragEnd);

      function dragStart(e) {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX - currentX;
        startY = clientY - currentY;
      }

      function dragMove(e) {
        if (!isDragging) return;
        if(e.cancelable) e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let targetX = clientX - startX;
        let targetY = clientY - startY;

        const bounds = zone.getBoundingClientRect();
        const maxDistX = (bounds.width / 2) - 50;
        const maxDistY = (bounds.height / 2) - 50;

        currentX = Math.max(-maxDistX, Math.min(maxDistX, targetX));
        currentY = Math.max(-maxDistY, Math.min(maxDistY, targetY));

        pet.style.transform = `translate(${currentX}px, ${currentY}px)`;
      }

      function dragEnd() {
        if (!isDragging) return;
        isDragging = false;
        pet.style.transition = "transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
        currentX = 0; currentY = 0;
        pet.style.transform = `translate(0px, 0px)`;
        setTimeout(() => { pet.style.transition = "transform 0.1s ease"; }, 500);
      }
    }

    // SINKRONISASI UI UTAMA
    function syncDashboardUI() {
      const pData = playerBeasts[activePetKey];
      const db = EVOLUTION_DATABASE[activePetKey];
      
      let maxHp = 100;
      let renderName = "";
      let avatarHtml = "";

      // Logika pemisah render tipe Evolusi vs tipe Instan Mythic
      if(db.type === "epic-evo") {
        const currentPhase = db.phases[pData.phaseIndex];
        renderName = `${currentPhase.name} [Lvl ${pData.level}]`;
        avatarHtml = currentPhase.avatar;
        maxHp = currentPhase.hp + (pData.level * 15);
      } else {
        renderName = `👑 ${db.name} [Lvl ${pData.level}]`;
        avatarHtml = db.avatar;
        maxHp = db.hp + (pData.level * 30);
      }

      document.getElementById('dash-name-label').innerText = renderName;
      document.getElementById('dash-avatar-container').innerHTML = avatarHtml;
      document.getElementById('dash-potion-count').innerText = userInventory.potion;

      document.getElementById('dash-hp-text').innerText = `${pData.currentHp}/${maxHp}`;
      document.getElementById('dash-hp-bar').style.width = `${(pData.currentHp / maxHp) * 100}%`;
      
      document.getElementById('dash-hng-text').innerText = "100/100";
      document.getElementById('dash-hng-bar').style.width = "100%";

      document.getElementById('dash-exp-text').innerText = `${pData.exp}%`;
      document.getElementById('dash-exp-bar').style.width = `${pData.exp}%`;
    }

    function feedPet(emoji) {
      alert(`Kamu memberi makan pet kesayanganmu dengan ${emoji}!`);
    }

    // ========================================================
    // COMBAT FLOW ENGINE & DROP RATE ALGORITHM
    // ========================================================
    function triggerHuntWild() {
      const pData = playerBeasts[activePetKey];
      const db = EVOLUTION_DATABASE[activePetKey];

      // Pengaman khusus telur (kecuali naga untuk pengujian)
      if (db.type === "epic-evo" && pData.phaseIndex === 0 && activePetKey !== 'naga') { 
        alert("❌ Pet jenis ini masih berwujud Telur! Kamu harus menetaskannya terlebih dahulu sebelum bisa berburu.");
        return;
      }

      const rarities = ["Common", "Rare", "Epic", "Mythic", "Celestial"];
      const rarityWeights = [0.45, 0.30, 0.15, 0.08, 0.02]; 
      
      let rand = Math.random();
      let pickedRarity = "Common";
      let sum = 0;
      for(let i=0; i<rarities.length; i++){
        sum += rarityWeights[i];
        if(rand <= sum) { pickedRarity = rarities[i]; break; }
      }

      let enemyName = `Wild Spectrum Monster [${pickedRarity}]`;
      let multiplier = rarities.indexOf(pickedRarity) + 1;
      let enemyMaxHp = 50 * multiplier + Math.floor(Math.random() * 40);
      let enemyPower = 10 * multiplier;

      let myMaxHp = db.type === "epic-evo" ? (db.phases[pData.phaseIndex].hp + (pData.level * 15)) : (db.hp + (pData.level * 30));
      let myBasePower = db.type === "epic-evo" ? (db.phases[pData.phaseIndex].power + (pData.level * 5)) : (db.power + (pData.level * 10));
      let skillList = db.type === "epic-evo" ? db.skills : db.skills;

      combatState = {
        rarity: pickedRarity,
        myHp: pData.currentHp,
        myMaxHp: myMaxHp,
        myBasePower: myBasePower,
        enemyName: enemyName,
        enemyHp: enemyMaxHp,
        enemyMaxHp: enemyMaxHp,
        enemyPower: enemyPower,
        damageBuffActive: false,
        enemyStunned: false,
        skills: skillList
      };

      document.getElementById('enemy-rarity').innerText = pickedRarity.toUpperCase();
      document.getElementById('battle-my-name').innerText = db.type === "epic-evo" ? db.phases[pData.phaseIndex].name : db.name;
      document.getElementById('battle-my-avatar-container').innerHTML = db.type === "epic-evo" ? db.phases[pData.phaseIndex].avatar : db.avatar;
      
      document.getElementById('battle-enemy-name').innerText = enemyName;
      document.getElementById('battle-enemy-avatar-container').innerHTML = '<img src="wild_enemy.png" onerror="this.src=\'https://api.iconify.design/pixelarticons:bug.svg?color=%23ff4a4a\'" class="pet-avatar-render">';

      document.getElementById('skill1-name').innerText = combatState.skills[0];
      document.getElementById('skill1-dmg').innerText = `Dmg: ${Math.floor(combatState.myBasePower * 0.8)}`;
      document.getElementById('skill2-name').innerText = combatState.skills[1];
      document.getElementById('skill2-dmg').innerText = `Dmg: ${Math.floor(combatState.myBasePower * 1.3)}`;
      document.getElementById('skill3-name').innerText = combatState.skills[2];
      document.getElementById('skill3-dmg').innerText = `Dmg: ${Math.floor(combatState.myBasePower * 0.5)} (Stun 25%)`;

      document.getElementById('combat-log-box').innerHTML = `<div style="color:#00ffcc">⚔️ Musuh liar ${enemyName} muncul! Bersiaplah untuk bertarung!</div>`;
      
      updateCombatUI();
      showScreen('combat-screen');
    }

    function updateCombatUI() {
      document.getElementById('battle-my-hptext').innerText = `${combatState.myHp}/${combatState.myMaxHp} HP`;
      document.getElementById('battle-my-hpbar').style.width = `${(combatState.myHp / combatState.myMaxHp) * 100}%`;

      document.getElementById('battle-enemy-hptext').innerText = `${combatState.enemyHp}/${combatState.enemyMaxHp} HP`;
      document.getElementById('battle-enemy-hpbar').style.width = `${(combatState.enemyHp / combatState.enemyMaxHp) * 100}%`;
    }

    function writeLog(text, color = "#fff") {
      const box = document.getElementById('combat-log-box');
      box.innerHTML += `<div style="color:${color}">${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function executeSkill(slot) {
      if (combatState.myHp <= 0 || combatState.enemyHp <= 0) return;

      let dmg = 0;
      let action = combatState.skills[slot - 1];

      if (slot === 1) dmg = Math.floor(combatState.myBasePower * (0.75 + Math.random() * 0.2));
      else if (slot === 2) dmg = Math.floor(combatState.myBasePower * (1.2 + Math.random() * 0.3));
      else if (slot === 3) {
        dmg = Math.floor(combatState.myBasePower * 0.5);
        if (Math.random() <= 0.25) combatState.enemyStunned = true;
      }

      if (combatState.damageBuffActive) {
        dmg = dmg * 2;
        combatState.damageBuffActive = false;
        writeLog("✨ Efek Pil Booster menggandakan damage serangan!", "#ffcc00");
      }

      combatState.enemyHp = Math.max(0, combatState.enemyHp - dmg);
      writeLog(`💥 Pet menggunakan [${action}], menghasilkan ${dmg} damage!`, "#00ffcc");
      
      if (combatState.enemyStunned) {
        writeLog(`⚡ ${combatState.enemyName} Terkena Stun! Terkunci pada giliran ini.`, "#ffcc00");
      }

      updateCombatUI();

      if (combatState.enemyHp <= 0) {
        handleCombatVictory();
        return;
      }

      // TURN MUSUH
      setTimeout(() => {
        if (combatState.enemyStunned) {
          combatState.enemyStunned = false;
          return;
        }

        let enemyDmg = Math.floor(combatState.enemyPower * (0.8 + Math.random() * 0.4));
        combatState.myHp = Math.max(0, combatState.myHp - enemyDmg);
        playerBeasts[activePetKey].currentHp = combatState.myHp;
        
        writeLog(`🚨 ${combatState.enemyName} membalas, menghasilkan ${enemyDmg} damage!`, "#ff4a4a");
        updateCombatUI();

        if (combatState.myHp <= 0) {
          writeLog(`💀 Pet kamu pingsan! Kembali ke markas aman.`, "#ff4a4a");
          setTimeout(() => { showScreen('dash-screen'); }, 2000);
        }
      }, 800);
    }

    // FORMULA DROP RATE BERDASARKAN TINGKAT RARITY SESUAI ATURAN
    function handleCombatVictory() {
      writeLog(`🏆 Kemenangan Telak Berhasil Diraih!`, "#00ffcc");
      
      const r = combatState.rarity;
      let expGained = 20;
      let rolledPotionChance = 0;
      let rolledPillChance = 0;

      if (r === "Common" || r === "Rare") {
        rolledPillChance = 0.03;   // 3%
        rolledPotionChance = 0.01; // 1%
        expGained = r === "Common" ? 25 : 45;
      } else if (r === "Epic" || r === "Mythic") {
        rolledPillChance = 0.06;   // 6%
        rolledPotionChance = 0.03; // 3%
        expGained = r === "Epic" ? 80 : 150;
      } else if (r === "Celestial") {
        rolledPillChance = 0.10;   // 10%
        rolledPotionChance = 0.06; // 6%
        expGained = 300;
      }

      writeLog(`⭐ Mendapatkan +${expGained} EXP Points.`, "#00ffcc");

      // Roll Drop Item
      if (Math.random() <= rolledPotionChance) {
        userInventory.potion += 1;
        writeLog(`🧪 Beruntung! Menemukan 1x Cairan Healer (100% HP).`, "#00ffcc");
      }
      if (Math.random() <= rolledPillChance) {
        userInventory.pill += 1;
        writeLog(`💊 Beruntung! Menemukan 1x Pil Booster (2x Damage).`, "#00ffcc");
      }

      let pData = playerBeasts[activePetKey];
      const db = EVOLUTION_DATABASE[activePetKey];
      
      // Update data Level up khusus untuk tipe hewan starter yang bisa evolusi
      pData.exp += expGained;
      if (pData.exp >= 100) {
        pData.level += 1;
        pData.exp -= 100;
        writeLog(`🎉 LEVEL UP! Pet meningkat ke Level ${pData.level}!`, "#ffcc00");

        if (db.type === "epic-evo" && pData.level >= (pData.phaseIndex + 1) * 5 && pData.phaseIndex < 4) {
          pData.phaseIndex += 1;
          alert(`✨ FANTASTIS! Pet kamu berevolusi ke Fasa ${pData.phaseIndex + 1}!`);
        }
      }

      setTimeout(() => { showScreen('dash-screen'); }, 2500);
    }

    function attemptFlee() {
      writeLog("🏃 Memilih melarikan diri dari wilayah pertempuran...", "#ffcc00");
      setTimeout(() => { showScreen('dash-screen'); }, 1000);
    }

    // ========================================================
    // TAS / INVENTORY MANAGEMENT
    // ========================================================
    let bagContext = "dash";
    function openBagFromDash() { bagContext = "dash"; openModal(); }
    function openBattleInventory() { bagContext = "battle"; openModal(); }

    function openModal() {
      document.getElementById('modal-qty-potion').innerText = userInventory.potion;
      document.getElementById('modal-qty-pill').innerText = userInventory.pill;
      document.getElementById('inventory-modal').style.display = 'flex';
    }

    function closeInventoryModal() {
      document.getElementById('inventory-modal').style.display = 'none';
      if(bagContext === 'dash') syncDashboardUI();
    }

    function useItemInBattle(type) {
      if (type === '🧪') {
        if (userInventory.potion <= 0) { alert("Item habis!"); return; }
        userInventory.potion--;
        
        if (bagContext === "battle") {
          combatState.myHp = combatState.myMaxHp;
          playerBeasts[activePetKey].currentHp = combatState.myMaxHp;
          writeLog("🧪 Menggunakan Cairan Healer! HP dipulihkan penuh 100%.", "#00ffcc");
          updateCombatUI();
        } else {
          let pData = playerBeasts[activePetKey];
          const db = EVOLUTION_DATABASE[activePetKey];
          let maxHp = db.type === "epic-evo" ? (db.phases[pData.phaseIndex].hp + (pData.level * 15)) : (db.hp + (pData.level * 30));
          pData.currentHp = maxHp;
          alert("🧪 HP Berhasil disembuhkan penuh dari dashboard!");
        }
      } else if (type === '💊') {
        if (bagContext !== "battle") { alert("Pil 2x damage hanya bisa ditelan saat pertarungan berlangsung!"); return; }
        if (userInventory.pill <= 0) { alert("Item habis!"); return; }
        userInventory.pill--;
        combatState.damageBuffActive = true;
        writeLog("💊 Memakan Pil Booster! Giliran serangan berikutnya akan menghasilkan kerusakan ganda.", "#ffcc00");
      }
      openModal();
    }

    // ========================================================
    // BESTIARY WINDOW DISPLAY GENERATOR (SYSTEM SILHOUETTE)
    // ========================================================
    function openBestiary() {
      const wrapper = document.getElementById('bestiary-list-wrapper');
      wrapper.innerHTML = ""; 

      Object.keys(EVOLUTION_DATABASE).forEach(key => {
        const db = EVOLUTION_DATABASE[key];
        const state = playerBeasts[key];
        const isDiscovered = discoveredPets.includes(key);

        let renderName = "Belum Ditemukan";
        let renderAvatar = "❓";
        let subText = `Spesies: ${key.toUpperCase()}`;

        if(isDiscovered) {
          if(db.type === "epic-evo") {
            renderName = db.phases[state.phaseIndex].name;
            renderAvatar = db.phases[state.phaseIndex].avatar;
            subText += ` | Lvl ${state.level} (Fasa ${state.phaseIndex + 1})`;
          } else {
            renderName = db.name;
            renderAvatar = db.avatar;
            subText += ` | Lvl ${state.level} (Mythic Instan)`;
          }
        }

        const node = document.createElement('div');
        node.className = `pet-list-item ${key === activePetKey ? 'active-pet' : ''} ${!isDiscovered ? 'silhouette' : ''}`;
        
        node.innerHTML = `
          <div class="item-left-info">
            <div class="list-avatar-box">${renderAvatar}</div>
            <div class="list-details">
              <h4>${renderName}</h4>
              <p>${subText}</p>
            </div>
          </div>
          <div>
            ${key === activePetKey ? '<span style="font-size:11px;color:var(--accent-green)">Active</span>' : isDiscovered ? '<button style="padding:5px 10px; font-size:11px; cursor:pointer;">SWITCH</button>' : ''}
          </div>
        `;

        if (isDiscovered && key !== activePetKey) {
          node.querySelector('button').onclick = function(e) {
            e.stopPropagation();
            activePetKey = key;
            openBestiary(); 
          };
        }
        wrapper.appendChild(node);
      });

      showScreen('bestiary-screen');
    }
  </script>
</body>
