<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color-scale=1.0, user-scalable=no" />
  <title>Beast Engine v3 - Stable Bypass</title>
  <style>
    /* --- SYSTEM CORE STYLES --- */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff; overflow: hidden; user-select: none; -webkit-user-select: none;
    }
    #app-container {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; background: #070708;
    }

    /* 📡 INITIALIZER OVERLAY (SCREEN LOCK) */
    .runtime-init-shield {
      position: absolute; inset: 0; background: #000000; z-index: 999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; box-sizing: border-box; transition: opacity 0.4s ease;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
      border-left-color: #00ffcc; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .init-status { margin-top: 15px; color: #00ffcc; font-size: 13px; font-family: monospace; }

    /* --- GAME INTERFACE --- */
    .game-header { padding: 15px; background: #111215; border-bottom: 1px solid #1f2026; text-align: center; }
    .pet-display { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .pet-avatar { font-size: 80px; margin-bottom: 10px; transition: transform 0.1s; }
    .pet-avatar.bounce { transform: scale(1.2); }
    
    .stats-container { width: 85%; background: #111215; padding: 15px; border-radius: 12px; border: 1px solid #1f2026; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .stat-row:last-child { margin-bottom: 0; }
    .bar-bg { width: 120px; height: 12px; background: #22242b; border-radius: 6px; overflow: hidden; margin-left: 10px; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }
    
    /* --- ACTION BUTTONS --- */
    .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; background: #111215; }
    .btn {
      background: #1f2026; border: 1px solid #2d3039; color: #fff; padding: 12px;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { background: #2d3039; }
    
    /* ⚡ BYPASS CONTROL PANEL */
    .bypass-panel {
      grid-column: span 2; background: linear-gradient(135deg, #0d2b26 0%, #051614 100%);
      border: 1px solid #00ffcc !important; color: #00ffcc !important; box-shadow: 0 0 10px rgba(0,255,204,0.2);
    }
    .bypass-panel:active { background: #0d2b26 !important; opacity: 0.9; }

    /* --- LOG CONSOLE OVERLAY --- */
    #debug-console {
      width: 90%; max-height: 100px; overflow-y: auto; background: #110000;
      border: 1px solid #ff4a4a; border-radius: 6px; margin-top: 15px;
      padding: 8px; font-family: monospace; font-size: 11px; text-align: left; display: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <div id="runtime-init-shield" class="runtime-init-shield">
      <div class="spinner"></div>
      <div id="init-text" class="init-status">Sedang memverifikasi data mesin...</div>
      <div id="debug-console"></div>
    </div>

    <div class="game-header">
      <h3 id="pet-name" style="margin:0; font-size:18px; color:#fff;">👾 Loading Beast...</h3>
    </div>

    <div class="pet-display">
      <div id="pet-icon" class="pet-avatar">🥚</div>
      
      <div class="stats-container">
        <div class="stat-row">
          <span>❤️ HP</span>
          <div style="display:flex; align-items:center;">
            <span id="hp-val">100/100</span>
            <div class="bar-bg"><div id="hp-bar" class="bar-fill" style="background:#ff4a4a;"></div></div>
          </div>
        </div>
        <div class="stat-row">
          <span>⚡ Energi</span>
          <div style="display:flex; align-items:center;">
            <span id="energy-val">50/50</span>
            <div class="bar-bg"><div id="energy-bar" class="bar-fill" style="background:#ffcc00;"></div></div>
          </div>
        </div>
        <div class="stat-row">
          <span>🪙 Koin</span>
          <span id="coin-val" style="color:#00ffcc; font-weight:bold;">0</span>
        </div>
      </div>
    </div>

    <div class="action-grid">
      <button class="btn" id="btn-feed">🍎 Beri Makan</button>
      <button class="btn" id="btn-hunt">⚔️ Berburu</button>
      <button class="btn" id="btn-sleep">💤 Istirahat</button>
      <button class="btn" id="btn-heal">💖 Pulihkan</button>
      
      <button class="btn bypass-panel" id="btn-bypass-signal">
        📡 KIRIM PASS-THROUGH SIGNAL (BYPASS)
      </button>
    </div>

  </div>

  <script>
    // ==========================================
    // 🛡️ EMERGENCY ERROR CATCHER & MONITOR
    // ==========================================
    window.addEventListener('error', function(e) {
      const consoleEl = document.getElementById('debug-console');
      if (consoleEl) {
        consoleEl.style.display = 'block';
        consoleEl.innerHTML += `<div style="color:#ff4a4a; margin-bottom:5px;">❌ <b>Error:</b> ${e.message} (Line: ${e.lineno})</div>`;
      }
    });

    function logStatus(msg, isSuccess = true) {
      const txt = document.getElementById('init-text');
      if (txt) txt.innerText = msg;
      const consoleEl = document.getElementById('debug-console');
      if (consoleEl) {
        consoleEl.innerHTML += `<div style="color:${isSuccess ? '#00ffcc' : '#ffcc00'}">📝 ${msg}</div>`;
      }
    }

    // ==========================================
    // ⚙️ GAME STATE & ENGINE DATA
    // ==========================================
    let gameState = {
      name: "Cyber Beast",
      hp: 100, maxHp: 100,
      energy: 50, maxEnergy: 50,
      coins: 10
    };

    // Safe Engine Loader
    document.addEventListener("DOMContentLoaded", function() {
      logStatus("Inisialisasi DOM sukses...");

      // 1. CLEAR CORRUPTED STORAGE
      try {
        localStorage.removeItem("BLDS_BEAST_STATE_V3");
        localStorage.removeItem("BLDS_BEAST_BAG_V3");
        logStatus("Storage lama dibersihkan...");
      } catch(e) {
        logStatus("Gagal akses localStorage (Normal di Sandbox)", false);
      }

      // 2. RENDER DATA KE TAMPILAN
      updateUI();

      // 3. SAFE BUTTON ATTACHMENT (Mencegah Error Null Yang Bikin Macet)
      bindButton("btn-feed", () => doAction('feed'));
      bindButton("btn-hunt", () => doAction('hunt'));
      bindButton("btn-sleep", () => doAction('sleep'));
      bindButton("btn-heal", () => doAction('heal'));
      bindButton("btn-bypass-signal", function() {
        sendBypassSignal();
      });

      // 4. PAKSA BUKA OVERLAY HITAM (ANTI STUCK)
      setTimeout(() => {
        const shield = document.getElementById('runtime-init-shield');
        if (shield) {
          shield.style.opacity = '0';
          setTimeout(() => { shield.style.display = 'none'; }, 400);
        }
      }, 1000); 
    });

    // Fungsi Pengikat Tombol yang Aman dari Eror Null
    function bindButton(id, callback) {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          const icon = document.getElementById('pet-icon');
          if(icon) {
            icon.classList.add('bounce');
            setTimeout(() => icon.classList.remove('bounce'), 150);
          }
          callback();
        });
      } else {
        logStatus(`Opsi info: elemen [${id}] dilewati.`, false);
      }
    }

    // Fungsi Aksi Simulasi Game
    function doAction(action) {
      if (action === 'feed') {
        gameState.energy = Math.min(gameState.maxEnergy, gameState.energy + 15);
        logStatus("Beast kenyang! Energi bertambah.");
      } else if (action === 'hunt') {
        if (gameState.energy >= 10) {
          gameState.energy -= 10;
          gameState.coins += Math.floor(Math.random() * 15) + 5;
          logStatus("Berhasil berburu! Koin didapatkan.");
        } else {
          logStatus("Energi habis! Istirahat dulu.", false);
        }
      } else if (action === 'sleep') {
        gameState.energy = gameState.maxEnergy;
        gameState.hp = Math.min(gameState.maxHp, gameState.hp + 10);
        logStatus("Beast segar bugar kembali!");
      } else if (action === 'heal') {
        if (gameState.coins >= 5) {
          gameState.coins -= 5;
          gameState.hp = gameState.maxHp;
          logStatus("HP berhasil dipulihkan penuh!");
        } else {
          logStatus("Koin tidak cukup untuk beli ramuan!", false);
        }
      }
      updateUI();
    }

    // Sinkronisasi Data ke Tampilan Layar
    function updateUI() {
      try {
        document.getElementById('pet-name').innerText = `👾 ${gameState.name}`;
        document.getElementById('hp-val').innerText = `${gameState.hp}/${gameState.maxHp}`;
        document.getElementById('energy-val').innerText = `${gameState.energy}/${gameState.maxEnergy}`;
        document.getElementById('coin-val').innerText = gameState.coins;

        document.getElementById('hp-bar').style.width = `${(gameState.hp / gameState.maxHp) * 100}%`;
        document.getElementById('energy-bar').style.width = `${(gameState.energy / gameState.maxEnergy) * 100}%`;

        const iconEl = document.getElementById('pet-icon');
        if (gameState.hp <= 30) iconEl.innerText = "🥀";
        else if (gameState.energy <= 15) iconEl.innerText = "🥱";
        else iconEl.innerText = "🦖";
      } catch(e) {}
    }

    // ==========================================
    // 📡 CORE BYPASS: FORCED SIGNAL EMITTER
    // ==========================================
    function sendBypassSignal() {
      logStatus("Menyiapkan muatan bypass...");
      
      const bypassPayload = {
        type: "SAVE_GAME",
        source: "BEAST_ENGINE_BYPASS",
        timestamp: Date.now(),
        data: {
          state: {
            stats: { hp: 100, maxHp: 100, energy: 50, maxEnergy: 50, level: 99 },
            currency: { gold: 99999, diamonds: 999 },
            status: "ACTIVE_BYPASS_VERIFIED"
          },
          bag: { items: [{ id: "master_key", qty: 1 }, { id: "elixir_max", qty: 99 }] }
        }
      };

      // Metode Kirim 1: Menggunakan Target Parent Window (Iframe)
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(JSON.stringify(bypassPayload), "*");
          window.parent.postMessage(bypassPayload, "*"); 
          logStatus("Sinyal dilempar ke Parent Window!");
        } catch(e) {
          logStatus("Gagal kirim ke Parent (Cross-Origin Blocked)", false);
        }
      }

      // Metode Kirim 2: Menggunakan Android Bridge WebView
      if (window.Android && typeof window.Android.postMessage === 'function') {
        try {
          window.Android.AndroidBridge(JSON.stringify(bypassPayload));
          logStatus("Sinyal disuntikkan ke Android Bridge!");
        } catch(e) {}
      }

      // Metode Kirim 3: Salinan lokal untuk cadangan
      try {
        localStorage.setItem("BLDS_BEAST_STATE_V3", JSON.stringify(bypassPayload.data.state));
        localStorage.setItem("BLDS_BEAST_BAG_V3", JSON.stringify(bypassPayload.data.bag));
      } catch(e) {}

      alert("📡 Sinyal bypass terkirim! Silakan cek respon pada aplikasi induk lu.");
    }
  </script>
</body>
</html>
