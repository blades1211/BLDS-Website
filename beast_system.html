<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beast Engine Core Game</title>
  <style>
    :root {
      --bg-black: #000000;
      --box-bg: #070708;
      --border-line: #1f2026;
      --cyan-neon: #00ffcc;
      --purple-neon: #bf5af2;
      --orange-fire: #ffcc00;
      --red-alert: #ff4a4a;
    }

    body, html {
      margin:0; padding:0; width:100%; height:100%;
      background: var(--bg-black); color:#fff;
      font-family: sans-serif; overflow: hidden;
    }

    #wrapper {
      display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box;
    }

    .nav-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .tab-trigger {
      background: transparent; border: 1px solid #2d3039; color: #fff; padding: 8px;
      border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center;
    }
    .tab-trigger.active { border-color: var(--cyan-neon); color: var(--cyan-neon); background: rgba(0, 255, 204, 0.03); }

    .view-panel { display: none; width: 100%; height: 100%; }
    .view-panel.active { display: block; }

    .card-board {
      border: 1px solid var(--border-line); border-radius: 8px; padding: 12px; background: var(--box-bg);
      display: flex; flex-direction: column; align-items: center; height: 82vh; box-sizing: border-box;
    }

    .header-info-row { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; }
    .display-box-item { background: #111215; padding: 6px; border-radius: 4px; border: 1px solid var(--border-line); font-size: 11px; }

    .arena-render-center {
      flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; position: relative;
    }
    .img-avatar-core { width: 110px; height: 110px; object-fit: contain; }
    .label-title-pet { font-size: 13px; margin-top: 10px; font-family: monospace; font-weight: bold; }

    .action-hunt-btn {
      width: 100%; border: 1px solid var(--red-alert); background: rgba(255, 74, 74, 0.08);
      color: var(--red-alert); padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 10px 0;
    }

    /* --- CUTSCENE LAYER --- */
    #cutscene-curtain {
      position: fixed; inset: 0; background: #000000; z-index: 99999;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .text-scroller { font-family: monospace; font-size: 14px; margin: 10px; opacity: 0; transition: opacity 0.4s ease; text-align: center; }
    .banner-impact-title { font-size: 28px; font-weight: 900; color: var(--orange-fire); opacity: 0; transform: scale(0.7); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; }
    .banner-impact-title.pop-up { opacity: 1; transform: scale(1); }

    /* --- DRAWER OVERLAY --- */
    #selector-drawer {
      position: fixed; bottom: -100%; left: 0; width: 100%; background: #050506;
      border-top: 2px solid var(--purple-neon); border-radius: 16px 16px 0 0; padding: 20px 12px;
      box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; align-items: center;
      transition: bottom 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100000;
    }
    #selector-drawer.open { bottom: 0; }

    .grid-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    .card-option {
      background: #111215; border: 1px solid var(--border-line); border-radius: 8px; padding: 10px 4px;
      display: flex; flex-direction: column; align-items: center; cursor: pointer; text-align: center;
    }
    .card-option img { width: 50px; height: 50px; object-fit: contain; }
    .confirm-btn { width: 100%; background: var(--purple-neon); color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; display: none; cursor: pointer; }
  </style>
</head>
<body>

  <div id="cutscene-curtain">
    <div id="cutscene-txt-1" class="text-scroller">AUTHENTICATING BACKLIGHT CORE LINK...</div>
    <div id="cutscene-txt-2" class="text-scroller">ACCESS GRANTED: BREAKING DIMENSIONAL BOUNDARY</div>
    <div id="cutscene-banner" class="banner-impact-title">CORE AWAKENING</div>
  </div>

  <div id="selector-drawer">
    <h4 id="drawer-title" style="margin:0; color: var(--purple-neon); font-family: monospace; letter-spacing:1px;">MYTHIC AWAKENING</h4>
    <p style="margin:0; font-size:11px; color:#666;">Select a mythic entity to bind with your core matrix data.</p>
    
    <div class="grid-options">
      <div class="card-option" onclick="selectMythic('ammit')">
        <img src="ammit.png" onerror="this.src='https://api.iconify.design/pixelarticons:avatar.svg?color=%23bf5af2'">
        <div style="font-size:10px; margin-top:5px; font-weight:bold;">Ammit Void</div>
      </div>
      <div class="card-option" onclick="selectMythic('sleipnir')">
        <img src="sleipnir.png" onerror="this.src='https://api.iconify.design/pixelarticons:shield.svg?color=%23bf5af2'">
        <div style="font-size:10px; margin-top:5px; font-weight:bold;">Sleipnir</div>
      </div>
      <div class="card-option" onclick="selectMythic('yatagarasu')">
        <img src="yatagarasu.png" onerror="this.src='https://api.iconify.design/pixelarticons:zap.svg?color=%23bf5af2'">
        <div style="font-size:10px; margin-top:5px; font-weight:bold;">Yatagarasu</div>
      </div>
    </div>
    <button id="submit-evolution-btn" class="confirm-btn" onclick="bindMythicEvolution()">MERGE CORE CHANNELS</button>
  </div>

  <div id="wrapper">
    <div class="nav-tabs">
      <div class="tab-trigger active">MATRIX HUB</div>
      <div class="tab-trigger">BESTIARY</div>
    </div>

    <div class="view-panel active">
      <div class="card-board">
        <div class="header-info-row">
          <div id="identity-tag-label" style="font-size:11px; color:var(--cyan-neon); font-weight:bold;">SYSTEM NOMADIC</div>
          <div class="display-box-item">HP: 150/150</div>
        </div>

        <div class="arena-render-center">
          <div style="text-align: center;">
            <div id="avatar-viewport">
              <img src="naga1.png" class="img-avatar-core" onerror="this.src='https://api.iconify.design/pixelarticons:android.svg?color=%2300ffcc'">
            </div>
            <div class="label-title-pet" id="name-viewport">Aethelgard Dragon</div>
          </div>
        </div>

        <button class="action-hunt-btn">SYSTEM ENGINE ONLINE</button>
      </div>
    </div>
  </div>

  <script>
    let currentSelectedMythic = null;
    let sequenceLock = false;

    const PET_DATABASE = {
      naga: { name: "Aethelgard Dragon", file: "naga1.png" },
      ammit: { name: "Ammit Void-Guardian", file: "ammit.png" },
      sleipnir: { name: "Sleipnir Gravity-Drive", file: "sleipnir.png" },
      yatagarasu: { name: "Yatagarasu Eclipse", file: "yatagarasu.png" }
    };

    window.addEventListener("message", function(msg) {
      if (!msg.data) return;

      if (msg.data.type === 'TRIGGER_SECRET_CUTSCENE') {
        executeSequenceProcess(msg.data.codeName);
      }

      if (msg.data.type === 'TELEMETRY_UPDATE') {
        if (msg.data.data) {
          let dayCount = parseInt(msg.data.data.highestCount) || 0;
          document.getElementById('identity-tag-label').innerText = msg.data.data.dominionName || "Blacklight Core";
          
          if (dayCount === 100 && !sequenceLock) {
            executeSequenceProcess("STREAK 100 DAY");
          }
        }
      }

      // KODE RESET PAKSA DARI LUAR (INDEX)
      if (msg.data.type === 'FORCE_RESET_TO_START') {
        sequenceLock = false;
        currentSelectedMythic = null;
        
        // Sembunyikan semua elemen UI cutscene & drawer
        document.getElementById('cutscene-curtain').style.display = 'none';
        document.getElementById('selector-drawer').classList.remove('open');
        document.getElementById('submit-evolution-btn').style.display = 'none';
        
        // Bersihkan border pilihan card
        document.querySelectorAll('.card-option').forEach(c => c.style.borderColor = '#1f2026');
        
        // Balikin pet ke Naga awal
        document.getElementById('name-viewport').innerText = PET_DATABASE.naga.name;
        document.getElementById('avatar-viewport').innerHTML = `<img src="${PET_DATABASE.naga.file}" class="img-avatar-core" onerror="this.src='https://api.iconify.design/pixelarticons:android.svg?color=%2300ffcc'">`;
      }
    });

    function executeSequenceProcess(headerText) {
      sequenceLock = true;
      const overlay = document.getElementById('cutscene-curtain');
      const t1 = document.getElementById('cutscene-txt-1');
      const t2 = document.getElementById('cutscene-txt-2');
      const banner = document.getElementById('cutscene-banner');
      const drawerTitle = document.getElementById('drawer-title');

      banner.innerText = headerText.toUpperCase();
      drawerTitle.innerText = `AWAKENING: ${headerText.toUpperCase()}`;

      overlay.style.display = 'flex';

      setTimeout(() => { t1.style.opacity = '1'; }, 400);
      setTimeout(() => { t1.style.opacity = '0'; }, 1800);
      
      setTimeout(() => { t2.style.opacity = '1'; }, 2200);
      setTimeout(() => { t2.style.opacity = '0'; }, 3600);

      setTimeout(() => { banner.classList.add('pop-up'); }, 4100);

      setTimeout(() => {
        overlay.style.display = 'none';
        banner.classList.remove('pop-up');
        document.getElementById('selector-drawer').classList.add('open');
      }, 6200);
    }

    function selectMythic(key) {
      currentSelectedMythic = key;
      document.querySelectorAll('.card-option').forEach(c => c.style.borderColor = '#1f2026');
      event.currentTarget.style.borderColor = 'var(--purple-neon)';
      document.getElementById('submit-evolution-btn').style.display = 'block';
    }

    function bindMythicEvolution() {
      if (!currentSelectedMythic) return;
      const pet = PET_DATABASE[currentSelectedMythic];
      
      document.getElementById('name-viewport').innerText = pet.name;
      document.getElementById('avatar-viewport').innerHTML = `<img src="${pet.file}" class="img-avatar-core" onerror="this.src='https://api.iconify.design/pixelarticons:zap.svg?color=%23bf5af2'">`;
      
      document.getElementById('selector-drawer').classList.remove('open');
      document.getElementById('submit-evolution-btn').style.display = 'none';
      
      sequenceLock = false;
      alert(`SUCCESS: Data Core ${pet.name} synchronized.`);
    }
  </script>
</body>
</html>
