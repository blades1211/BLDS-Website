<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117; /* Warna background gelap biar logo bercahaya lebih kelihatan */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        /* Style untuk Logo dengan efek bercahaya dan animasi naik turun */
        .logo {
            max-width: 150px; /* Atur ukuran logo di sini */
            height: auto;
            margin-bottom: 30px;
            /* Efek bayangan bercahaya (glow) */
            filter: drop-shadow(0 0 20px rgba(0, 149, 255, 0.6)); 
            /* Menjalankan animasi bernama 'float' selama 4 detik, bolak-balik, dan smooth */
            animation: float 4s ease-in-out infinite;
        }

        /* Animasi naik turun smooth */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px); /* Naik 15 pixel */
            }
            100% {
                transform: translateY(0px);
            }
        }

        /* Style Teks */
        .title {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffffff, #a3a3a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #8b949e;
            font-weight: 400;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo" class="logo">
        
        <h1 class="title">Coming Soon</h1>
        <p class="subtitle">Under Maintenance & Improvement</p>
    </div>

</body>
</html>
