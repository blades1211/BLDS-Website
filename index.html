<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLDS Core Dominion</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        /* Kontainer Utama Website Kamu */
        #mainMenuContainer {
            display: block; /* Tampil di awal */
            text-align: center;
            margin-top: 50px;
        }
        /* Kontainer khusus Pembungkus Game Beast Engine */
        #beastEngineContainer {
            display: none; /* Tersembunyi di awal, muncul saat game dibuka */
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        iframe {
            width: 100%;
            height: 680px;
            border: none;
            background: transparent;
        }
        .btn-menu {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="mainMenuContainer">
        <h2>BLDS MAIN HUB DIRECTORY</h2>
        <p>Selamat Datang di Core System.</p>
        <button class="btn-menu" onclick="masukBeastEngine()">🎮 OPEN BEAST ENGINE</button>
    </div>

    <div id="beastEngineContainer">
        <iframe id="beastIframe" src="index_beast_system.html"></iframe>
    </div>

    <script>
        // Data Mockup Telemetri Player Utama (Sesuaikan dengan sistem login/save website kamu)
        let playerProfileData = {
            dominionName: "X_Doms_Player", // Nama player kamu yang akan dikirim ke Firebase
            count: 12,                    // Streak saat ini
            highestCount: 45              // Rekor Streak tertinggi
        };

        let currentActivePet = {
            name: "Ikan5" // File asset pet yang aktif
        };

        // Fungsi ketika user menekan tombol masuk ke game Beast Engine
        function masukBeastEngine() {
            document.getElementById("mainMenuContainer").style.display = "none";
            document.getElementById("beastEngineContainer").style.display = "block";
            
            // Berikan jeda sedikit agar iframe loading sempurna, lalu kirim data profil ke dalam game
            setTimeout(() => {
                let iframeWin = document.getElementById("beastIframe").contentWindow;
                if(iframeWin) {
                    iframeWin.postMessage({
                        type: 'TELEMETRY_UPDATE',
                        data: playerProfileData,
                        pet: currentActivePet
                    }, '*');
                }
            }, 500);
        }

        // ====================================================================
        // 📡 NYAWA UTAMANYA DI SINI: Mendengarkan Sinyal Balik Dari Dalam Iframe
        // ====================================================================
        window.addEventListener("message", (event) => {
            
            // 1. Tangkap Sinyal Navigasi Keluar / Tombol Back Dari Leaderboard Game
            if (event.data && event.data.type === 'BEAST_NAVIGATE_BACK') {
                console.log("Sinyal kembali diterima! Memulihkan navigasi menu utama...");
                
                // Sembunyikan container game, tampilkan kembali menu utama website kamu
                document.getElementById("beastEngineContainer").style.display = "none";
                document.getElementById("mainMenuContainer").style.display = "block";
            }

            // 2. Tangkap Sinyal Handshake (Saat game baru dibuka dan meminta data ulang)
            if (event.data && event.data.type === 'BEAST_HANDSHAKE_REQ') {
                let iframeWin = document.getElementById("beastIframe").contentWindow;
                if(iframeWin) {
                    iframeWin.postMessage({
                        type: 'TELEMETRY_UPDATE',
                        data: playerProfileData,
                        pet: currentActivePet
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
