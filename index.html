<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLDS HUB SYSTEM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #020205;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Pembungkus Gadget/UI Utama */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            height: 780px;
            border: 4px solid #111122;
            border-radius: 24px;
            background: #000000;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
        }

        /* 📱 PANEL 1: MENU UTAMA WEBSITE HUB */
        #mainMenuContainer {
            display: block; /* Aktif di awal */
            width: 100%;
            height: 100%;
            padding: 30px 20px;
            text-align: center;
            overflow-y: auto;
        }

        .hub-title {
            font-size: 20px;
            color: #00ffff;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }

        .hub-subtitle {
            font-size: 11px;
            color: #8888aa;
            margin-bottom: 40px;
        }

        /* Tombol Menu Utama Sleek Style */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-hub {
            width: 100%;
            background: rgba(255,255,255,0.02);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-hub:hover {
            background: #00ffff;
            color: #000000;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0,255,255,0.4);
            transform: translateY(-2px);
        }

        /* 🎮 PANEL 2: CONTAINER IFRAME GAME */
        #beastEngineContainer {
            display: none; /* Sembunyi di awal, muncul saat klik Beast Engine */
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        
        <div id="mainMenuContainer">
            <div class="hub-title">BLDS CORE SYSTEM</div>
            <div class="hub-subtitle">V.109 - BLACKLIGHT DIRECTORY</div>
            
            <div class="menu-grid">
                <button class="btn-hub" onclick="alert('Opening Archives...')">📂 ARCHIVES</button>
                <button class="btn-hub" onclick="alert('Opening Code Entry...')">🔑 ENTER CODE</button>
                <button class="btn-hub" style="border-color: #00ffff; color: #00ffff;" onclick="bukaGameBeastEngine()">🎮 BEAST ENGINE SYSTEM</button>
                <button class="btn-hub" onclick="alert('Opening Lore Panel...')">📜 LORE FLAMES</button>
            </div>
        </div>

        <div id="beastEngineContainer">
            <iframe id="beastIframe" src="index_beast_system.html"></iframe>
        </div>

    </div>

    <script>
        // Data Telemetri Profil Player (Otomatis dilempar ke game saat masuk)
        let playerProfileData = {
            dominionName: "X_Doms_Player", 
            count: 5,                    
            highestCount: 88              
        };

        let currentActivePet = {
            name: "Ikan5" 
        };

        // Fungsi pemicu saat tombol "BEAST ENGINE SYSTEM" di web diklik
        function bukaGameBeastEngine() {
            // Tukar visibilitas layer panel UI
            document.getElementById("mainMenuContainer").style.display = "none";
            document.getElementById("beastEngineContainer").style.display = "block";
            
            // Jeda sedikit biar iframe kelar loading, lalu inject data profil
            setTimeout(() => {
                let iframeWin = document.getElementById("beastIframe").contentWindow;
                if(iframeWin) {
                    iframeWin.postMessage({
                        type: 'TELEMETRY_UPDATE',
                        data: playerProfileData,
                        pet: currentActivePet
                    }, '*');
                }
            }, 400);
        }

        // ====================================================================
        // 📡 JEMBATAN NAVIGASI UTAMA (Mendengarkan Sinyal Keluar Dari Iframe)
        // ====================================================================
        window.addEventListener("message", (event) => {
            
            // Cek apakah data pesan beneran sinyal tombol BACK dari game
            if (event.data && event.data.type === 'BEAST_NAVIGATE_BACK') {
                console.log("Sinyal BACK terdeteksi! Memulihkan navigasi menu utama...");
                
                const menuUtama = document.getElementById("mainMenuContainer");
                const areaGame = document.getElementById("beastEngineContainer");

                // Jika elemen ID pembungkusnya cocok dan ketemu di DOM HTML
                if (menuUtama && areaGame) {
                    areaGame.style.display = "none";       // Sembunyikan game
                    menuUtama.style.display = "block";     // Munculkan menu utama lagi
                } else {
                    // 🚨 FAILSAFE SYSTEM: Jika ID-nya beda/hilang di kode aslimu,
                    // reload halaman otomatis agar balik ke menu utama & gak ngeblank!
                    window.location.reload(); 
                }
            }

            // Merespon handshake otomatis dari dalam game
            if (event.data && event.data.type === 'BEAST_HANDSHAKE_REQ') {
                let iframeWin = document.getElementById("beastIframe").contentWindow;
                if(iframeWin) {
                    iframeWin.postMessage({
                        type: 'TELEMETRY_UPDATE',
                        data: playerProfileData,
                        pet: currentActivePet
                    }, '*');
                }
            }
        });
    </script>
</body>
</html>
